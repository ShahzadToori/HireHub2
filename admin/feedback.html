<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employer Feedback – JobOrbit Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/JobOrbitFavicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    .fb-stat-card { background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.25rem;text-align:center }
    .fb-stat-num  { font-family:'Syne',sans-serif;font-size:1.75rem;font-weight:800;color:var(--text-primary);line-height:1 }
    .fb-stat-lbl  { font-size:.75rem;color:var(--text-muted);margin-top:.25rem }

    .fb-filters { display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem }
    .fb-filter-btn { padding:.3rem .8rem;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .15s }
    .fb-filter-btn.active { background:var(--primary);color:#fff;border-color:var(--primary) }

    .fb-list { border:1px solid var(--border);border-radius:14px;overflow:hidden }
    .fb-item { padding:1rem 1.25rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s }
    .fb-item:last-child { border-bottom:none }
    .fb-item:hover { background:var(--surface) }
    .fb-item.unread { border-left:3px solid var(--primary) }

    .fb-stars { color:#f59e0b;font-size:.85rem;letter-spacing:.05rem }
    .fb-stars-empty { color:var(--border) }

    .badge-new      { background:#dbeafe;color:#1d4ed8 }
    .badge-read     { background:var(--surface);color:var(--text-muted);border:1px solid var(--border) }
    .badge-resolved { background:#d1fae5;color:#065f46 }
    .badge-bug      { background:#fee2e2;color:#991b1b }
    .badge-feature  { background:#f3e8ff;color:#6b21a8 }
    .badge-general  { background:#dbeafe;color:#1e40af }
    .badge-other    { background:var(--surface);color:var(--text-muted);border:1px solid var(--border) }
    [data-theme=dark] .badge-new     { background:rgba(59,130,246,.2);color:#93c5fd }
    [data-theme=dark] .badge-resolved{ background:rgba(16,185,129,.15);color:#6ee7b7 }
    [data-theme=dark] .badge-bug     { background:rgba(239,68,68,.15);color:#fca5a5 }
    [data-theme=dark] .badge-feature { background:rgba(168,85,247,.15);color:#d8b4fe }

    .fb-badge { display:inline-block;padding:.15rem .55rem;border-radius:100px;font-size:.7rem;font-weight:700;text-transform:capitalize }

    .fb-detail { background:var(--surface);border-radius:10px;padding:.75rem 1rem;margin-top:.65rem;font-size:.85rem;color:var(--text-primary);line-height:1.6;display:none }
    .fb-item.expanded .fb-detail { display:block }

    .fb-actions { display:flex;gap:.4rem;margin-top:.6rem }
    .fb-action-btn { padding:.25rem .65rem;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:.74rem;font-weight:500;cursor:pointer;transition:all .12s }
    .fb-action-btn:hover { background:var(--primary);color:#fff;border-color:var(--primary) }
    .fb-action-btn.resolved { background:#d1fae5;color:#065f46;border-color:#a7f3d0 }

    .fb-empty { text-align:center;padding:3rem;color:var(--text-muted) }
    .fb-empty i { font-size:2.5rem;display:block;margin-bottom:.5rem }

    .avg-stars { font-size:1.5rem;color:#f59e0b }
  </style>
</head>
<body>

<!-- Sidebar (same structure as other admin pages — JS builds it) -->
<aside class="admin-sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="/JobOrbitFavicon.svg" alt="JobOrbit" class="sidebar-brand" style="height:40px">
    <span class="sidebar-brand">JobOrbit</span>
    <button class="btn-sidebar-close d-lg-none" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
  </div>
  <nav class="sidebar-nav">
    <!-- links injected by admin.js -->
    <hr class="sidebar-divider">
    <a href="/" class="sidebar-link" target="_blank"><i class="bi bi-box-arrow-up-right"></i><span>View Site</span></a>
    <button class="sidebar-link sidebar-btn" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></button>
  </nav>
</aside>
<div class="sidebar-overlay d-lg-none d-none" id="sidebarOverlay"></div>

<!-- Main -->
<div class="admin-main">
  <!-- Topbar -->
  <header class="admin-topbar">
    <button class="btn-hamburger d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
    <h1 class="topbar-title"><i class="bi bi-chat-heart me-2"></i>Employer Feedback</h1>
    <div class="topbar-right">
      <button class="btn-icon-admin" id="themeToggleAdmin" title="Toggle theme">
        <i class="bi bi-moon-fill" id="themeIcon"></i>
      </button>
    </div>
  </header>

  <div class="admin-content">

    <!-- Stats row -->
    <div class="row g-3 mb-4" id="statsRow">
      <div class="col-6 col-md-3">
        <div class="fb-stat-card">
          <div class="fb-stat-num" id="statTotal">—</div>
          <div class="fb-stat-lbl">Total</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="fb-stat-card">
          <div class="fb-stat-num" id="statNew" style="color:var(--primary)">—</div>
          <div class="fb-stat-lbl">New</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="fb-stat-card">
          <div class="avg-stars" id="statAvg">—</div>
          <div class="fb-stat-lbl">Avg Rating</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="fb-stat-card">
          <div class="fb-stat-num" id="statResolved" style="color:#10b981">—</div>
          <div class="fb-stat-lbl">Resolved</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="fb-filters" id="fbFilters">
      <button class="fb-filter-btn active" data-status="" onclick="setFilter(this,'status','')">All</button>
      <button class="fb-filter-btn" data-status="new" onclick="setFilter(this,'status','new')">🔵 New</button>
      <button class="fb-filter-btn" data-status="read" onclick="setFilter(this,'status','read')">Read</button>
      <button class="fb-filter-btn" data-status="resolved" onclick="setFilter(this,'status','resolved')">✅ Resolved</button>
      <span style="border-left:1px solid var(--border);margin:0 .2rem"></span>
      <button class="fb-filter-btn" data-rating="5" onclick="setFilter(this,'rating','5')">★★★★★</button>
      <button class="fb-filter-btn" data-rating="4" onclick="setFilter(this,'rating','4')">★★★★</button>
      <button class="fb-filter-btn" data-rating="3" onclick="setFilter(this,'rating','3')">★★★ &amp; below</button>
      <button class="fb-filter-btn" style="margin-left:auto" onclick="loadFeedback()">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>

    <!-- Feedback list -->
    <div id="fbList">
      <div class="fb-empty"><i class="bi bi-hourglass-split"></i>Loading…</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
/* ── State ── */
let allFeedback = [];
let activeStatus = '';
let activeRating = '';

/* ── Load feedback ── */
async function loadFeedback() {
  document.getElementById('fbList').innerHTML = '<div class="fb-empty"><i class="bi bi-hourglass-split"></i>Loading…</div>';
  try {
    const params = new URLSearchParams();
    if (activeStatus) params.set('status', activeStatus);
    if (activeRating) params.set('rating', activeRating);
    const r = await fetch('/api/admin/feedback?' + params, { credentials: 'include' });
    const d = await r.json();
    if (!d.success) { showError(); return; }
    allFeedback = d.feedback || [];
    renderStats();
    renderList();
  } catch(e) { showError(); }
}

/* ── Stats ── */
function renderStats() {
  const all = allFeedback;
  document.getElementById('statTotal').textContent = all.length;
  document.getElementById('statNew').textContent = all.filter(f => f.status === 'new').length;
  document.getElementById('statResolved').textContent = all.filter(f => f.status === 'resolved').length;
  const avg = all.length ? (all.reduce((s,f) => s + f.rating, 0) / all.length).toFixed(1) : '—';
  document.getElementById('statAvg').textContent = avg !== '—' ? avg + ' ★' : '—';
}

/* ── Render list ── */
function renderList() {
  const list = document.getElementById('fbList');
  if (!allFeedback.length) {
    list.innerHTML = '<div class="fb-empty"><i class="bi bi-chat-heart"></i>No feedback yet</div>';
    return;
  }
  list.innerHTML = '<div class="fb-list">' +
    allFeedback.map((f, i) => `
      <div class="fb-item ${f.status === 'new' ? 'unread' : ''}" id="fbi-${f.id}" onclick="toggleExpand(${f.id})">
        <div class="d-flex align-items-start justify-content-between gap-2 flex-wrap">
          <div>
            <strong style="font-size:.9rem;color:var(--text-primary)">${esc(f.company_name || 'Unknown company')}</strong>
            <span class="fb-badge badge-${f.category} ms-2">${catLabel(f.category)}</span>
            <span class="fb-badge badge-${f.status} ms-1">${f.status}</span>
          </div>
          <div style="font-size:.75rem;color:var(--text-muted);white-space:nowrap">
            ${fmtDate(f.created_at)}
          </div>
        </div>
        <div class="d-flex align-items-center gap-2 mt-1">
          <span class="fb-stars">${'★'.repeat(f.rating)}</span><span class="fb-stars-empty">${'★'.repeat(5 - f.rating)}</span>
          <span style="font-size:.78rem;color:var(--text-muted)">${esc(f.page_url || '')}</span>
        </div>
        <div class="fb-detail" id="fbd-${f.id}">
          <p style="margin:0 0 .75rem;white-space:pre-wrap">${esc(f.message)}</p>
          <div class="fb-actions">
            ${f.status !== 'read'     ? `<button class="fb-action-btn" onclick="markStatus(event,${f.id},'read')"><i class="bi bi-eye me-1"></i>Mark Read</button>` : ''}
            ${f.status !== 'resolved' ? `<button class="fb-action-btn ${f.status==='resolved'?'resolved':''}" onclick="markStatus(event,${f.id},'resolved')"><i class="bi bi-check-circle me-1"></i>Resolve</button>` : ''}
            ${f.status !== 'new'      ? `<button class="fb-action-btn" onclick="markStatus(event,${f.id},'new')"><i class="bi bi-arrow-counterclockwise me-1"></i>Reopen</button>` : ''}
          </div>
        </div>
      </div>
    `).join('') +
  '</div>';
}

/* ── Toggle expand ── */
function toggleExpand(id) {
  const item = document.getElementById('fbi-' + id);
  const detail = document.getElementById('fbd-' + id);
  if (!item || !detail) return;
  item.classList.toggle('expanded');
  // Auto-mark as read when opened
  const fb = allFeedback.find(f => f.id === id);
  if (fb && fb.status === 'new' && item.classList.contains('expanded')) {
    markStatus(null, id, 'read');
  }
}

/* ── Mark status ── */
async function markStatus(e, id, status) {
  if (e) e.stopPropagation();
  try {
    await fetch('/api/admin/feedback/' + id + '/status', {
      method: 'PATCH', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    const fb = allFeedback.find(f => f.id === id);
    if (fb) fb.status = status;
    renderStats();
    renderList();
    // Re-expand
    const item = document.getElementById('fbi-' + id);
    if (item) { item.classList.add('expanded'); }
  } catch(err) {}
}

/* ── Filters ── */
function setFilter(btn, type, val) {
  // Reset buttons in same group
  const isStar = type === 'rating';
  document.querySelectorAll('.fb-filter-btn').forEach(b => {
    const hasStar = b.dataset.rating !== undefined;
    if (isStar === hasStar) b.classList.remove('active');
  });
  btn.classList.add('active');
  if (type === 'status') activeStatus = val;
  else { activeRating = (activeRating === val) ? '' : val; if (!activeRating) btn.classList.remove('active'); }
  loadFeedback();
}

/* ── Helpers ── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function catLabel(c) {
  return { bug:'🐛 Bug', feature:'✨ Feature', general:'💬 General', other:'📝 Other' }[c] || c;
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' }) +
    ' ' + dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
function showError() {
  document.getElementById('fbList').innerHTML = '<div class="fb-empty"><i class="bi bi-exclamation-circle"></i>Failed to load feedback</div>';
}

loadFeedback();
</script>
</body>
</html>
