<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Users – JobOrbit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    .role-badge{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:100px;text-transform:capitalize}
    .role-super_admin{background:#dbeafe;color:#1e40af}
    .role-blog_editor{background:#d1fae5;color:#065f46}
    .role-job_manager{background:#fef3c7;color:#92400e}
    .role-job_reviewer{background:#fce7f3;color:#9d174d}
    .role-custom{background:#ede9fe;color:#5b21b6}
    [data-theme="dark"] .role-super_admin{background:rgba(59,130,246,.2);color:#93c5fd}
    [data-theme="dark"] .role-blog_editor{background:rgba(16,185,129,.2);color:#6ee7b7}
    [data-theme="dark"] .role-job_manager{background:rgba(245,158,11,.2);color:#fcd34d}
    [data-theme="dark"] .role-job_reviewer{background:rgba(236,72,153,.2);color:#f9a8d4}
    .perm-toggle{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border-radius:8px;cursor:pointer;transition:background .15s;font-size:.85rem}
    .perm-toggle:hover{background:var(--surface)}
    .perm-toggle input{cursor:pointer;width:16px;height:16px;accent-color:var(--primary)}
    .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:.3rem}
    .dot-active{background:#10b981}.dot-inactive{background:#ef4444}
    .menu-row{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border-radius:10px;background:var(--surface);margin-bottom:.5rem;cursor:grab;transition:box-shadow .15s}
    .menu-row:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
    .menu-row.dragging{opacity:.5;cursor:grabbing}
    .drag-handle{color:var(--text-muted);font-size:1.1rem;cursor:grab}
    .menu-toggle{cursor:pointer;accent-color:var(--primary);width:18px;height:18px}
  </style>
</head>
<body class="admin-body">
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/JobOrbitFavicon.svg" alt="JobOrbit" style="height:40px">
      <span class="sidebar-brand">JobOrbit</span>
      <button class="btn-sidebar-close d-lg-none" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
    </div>
    <nav class="sidebar-nav">
      <!-- Dynamically populated by admin.js -->
      <hr class="sidebar-divider">
      <a href="/" class="sidebar-link" target="_blank"><i class="bi bi-box-arrow-up-right"></i><span>View Site</span></a>
      <button class="sidebar-link sidebar-btn" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></button>
    </nav>
  </aside>
  <div class="sidebar-overlay d-lg-none d-none" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="btn-hamburger d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
      <h1 class="topbar-title"><i class="bi bi-people me-2"></i>Admin Users</h1>
      <div class="topbar-right">
        <div id="adminAvatar" class="admin-avatar" title=""></div>
        <button class="btn btn-icon" id="themeToggleAdmin" title="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
      </div>
    </header>

    <div class="admin-content">
      <ul class="nav nav-tabs mb-4" id="mainTabs">
        <li class="nav-item"><button class="nav-link active" onclick="showTab('users')"><i class="bi bi-people me-1"></i>Users</button></li>
        <li class="nav-item"><button class="nav-link" onclick="showTab('roles')"><i class="bi bi-shield me-1"></i>Roles</button></li>
        <li class="nav-item"><button class="nav-link" onclick="showTab('menu')"><i class="bi bi-list-ul me-1"></i>Menu</button></li>
      </ul>

      <!-- ── USERS TAB ── -->
      <div id="tab-users">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0 fw-bold">Admin Accounts</h6>
          <button class="btn btn-admin-primary btn-sm" onclick="openUserModal()"><i class="bi bi-plus-lg me-1"></i>New Admin</button>
        </div>
        <div class="admin-widget">
          <div class="table-responsive">
            <table class="table admin-table">
              <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
              <tbody id="users-tbody"><tr><td colspan="5" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ── ROLES TAB ── -->
      <div id="tab-roles" style="display:none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0 fw-bold">Roles & Permissions</h6>
          <button class="btn btn-admin-primary btn-sm" onclick="openRoleModal()"><i class="bi bi-plus-lg me-1"></i>New Role</button>
        </div>
        <div id="roles-grid" class="row g-3"></div>
      </div>

      <!-- ── MENU TAB ── -->
      <div id="tab-menu" style="display:none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0 fw-bold">Menu Management</h6>
          <div class="d-flex gap-2">
            <span class="text-muted" style="font-size:.8rem">Drag to reorder • Toggle to show/hide</span>
            <button class="btn btn-admin-primary btn-sm" onclick="saveMenuOrder()"><i class="bi bi-floppy me-1"></i>Save Order</button>
          </div>
        </div>
        <div class="admin-widget">
          <div id="menu-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- USER MODAL -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="userModalTitle">New Admin User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="user-id">
        <div class="mb-3"><label class="form-label fw-semibold">Full Name</label><input type="text" class="form-control" id="user-fullname" placeholder="John Doe"></div>
        <div class="mb-3"><label class="form-label fw-semibold">Username <span class="text-danger">*</span></label><input type="text" class="form-control" id="user-username"></div>
        <div class="mb-3"><label class="form-label fw-semibold">Email</label><input type="email" class="form-control" id="user-email"></div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password <span class="text-danger" id="pw-required">*</span></label>
          <input type="password" class="form-control" id="user-password" placeholder="Min 6 characters">
          <div class="form-text" id="pw-hint" style="display:none">Leave blank to keep current password</div>
        </div>
        <div class="mb-3"><label class="form-label fw-semibold">Role <span class="text-danger">*</span></label><select class="form-select" id="user-role"></select></div>
        <div class="mb-3" id="status-field" style="display:none">
          <label class="form-label fw-semibold">Status</label>
          <select class="form-select" id="user-status"><option value="active">Active</option><option value="inactive">Inactive (blocked)</option></select>
        </div>
        <div id="user-msg" class="mt-2" style="font-size:.83rem"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-admin-primary" id="user-save-btn" onclick="saveUser()"><i class="bi bi-floppy me-1"></i>Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ROLE MODAL -->
<div class="modal fade" id="roleModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="roleModalTitle">New Role</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="role-id">
        <div class="row g-3 mb-3">
          <div class="col-6"><label class="form-label fw-semibold">Role Slug <span class="text-danger">*</span></label><input type="text" class="form-control" id="role-name" placeholder="blog_editor"></div>
          <div class="col-6"><label class="form-label fw-semibold">Display Label <span class="text-danger">*</span></label><input type="text" class="form-control" id="role-label" placeholder="Blog Editor"></div>
        </div>
        <label class="form-label fw-semibold">Permissions — pages this role can access:</label>
        <div id="perms-grid" class="row g-2 mt-1"></div>
        <div id="role-msg" class="mt-2" style="font-size:.83rem"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-admin-primary" onclick="saveRole()"><i class="bi bi-floppy me-1"></i>Save Role</button>
      </div>
    </div>
  </div>
</div>

<!-- MENU EDIT MODAL -->
<div class="modal fade" id="menuModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Edit Menu Item</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="menu-id">
        <div class="mb-3"><label class="form-label fw-semibold">Label</label><input type="text" class="form-control" id="menu-label"></div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Icon (Bootstrap Icons class)</label>
          <div class="input-group">
            <span class="input-group-text"><i id="menu-icon-preview" class="bi bi-circle"></i></span>
            <input type="text" class="form-control" id="menu-icon" placeholder="bi-speedometer2" oninput="document.getElementById('menu-icon-preview').className='bi '+this.value">
          </div>
          <div class="form-text">Browse icons at <a href="https://icons.getbootstrap.com" target="_blank">icons.getbootstrap.com</a></div>
        </div>
        <div class="mb-3"><label class="form-label fw-semibold">URL (href)</label><input type="text" class="form-control" id="menu-href" placeholder="dashboard.html"></div>
        <div id="menu-msg" class="mt-2" style="font-size:.83rem"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-admin-primary" onclick="saveMenuItem()"><i class="bi bi-floppy me-1"></i>Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
let allRoles = [], allMenuItems = [];
let userModal, roleModal, menuModal;
let dragSrc = null;

(async function init() {
  await requireAuth();
  await initSidebar();
  initLogout();
  userModal = new bootstrap.Modal(document.getElementById('userModal'));
  roleModal = new bootstrap.Modal(document.getElementById('roleModal'));
  menuModal = new bootstrap.Modal(document.getElementById('menuModal'));
  loadUsers();
  loadRoles();
  loadMenuItems();
})();

function showTab(tab) {
  ['users','roles','menu'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? '' : 'none';
  });
  document.querySelectorAll('#mainTabs .nav-link').forEach((el, i) => {
    el.classList.toggle('active', ['users','roles','menu'][i] === tab);
  });
}

/* ── USERS ── */
async function loadUsers() {
  const res = await fetch('/api/admin-users');
  const data = await res.json();
  const tbody = document.getElementById('users-tbody');
  if (!data.success || !data.users.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No users yet</td></tr>';
    return;
  }
  tbody.innerHTML = data.users.map(u => {
    const roleClass = 'role-' + (u.role || 'custom');
    const dot = u.status === 'active' ? 'dot-active' : 'dot-inactive';
    const date = new Date(u.created_at).toLocaleDateString('en-GB');
    return `<tr>
      <td><div style="font-weight:600;font-size:.88rem">${u.full_name || u.username}</div><div style="font-size:.75rem;color:var(--text-muted)">@${u.username}${u.email ? ' · ' + u.email : ''}</div></td>
      <td><span class="role-badge ${roleClass}">${u.role || '—'}</span></td>
      <td><span class="status-dot ${dot}"></span>${u.status}</td>
      <td style="font-size:.82rem">${date}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick='editUser(${JSON.stringify(u)})'><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id},'${u.username}')"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`;
  }).join('');
}

function openUserModal() {
  document.getElementById('userModalTitle').textContent = 'New Admin User';
  document.getElementById('user-id').value = '';
  document.getElementById('user-fullname').value = '';
  document.getElementById('user-username').value = '';
  document.getElementById('user-email').value = '';
  document.getElementById('user-password').value = '';
  document.getElementById('pw-required').style.display = '';
  document.getElementById('pw-hint').style.display = 'none';
  document.getElementById('status-field').style.display = 'none';
  document.getElementById('user-msg').innerHTML = '';
  populateRoleSelect();
  userModal.show();
}

function editUser(u) {
  document.getElementById('userModalTitle').textContent = 'Edit: ' + u.username;
  document.getElementById('user-id').value = u.id;
  document.getElementById('user-fullname').value = u.full_name || '';
  document.getElementById('user-username').value = u.username;
  document.getElementById('user-email').value = u.email || '';
  document.getElementById('user-password').value = '';
  document.getElementById('pw-required').style.display = 'none';
  document.getElementById('pw-hint').style.display = '';
  document.getElementById('status-field').style.display = '';
  document.getElementById('user-status').value = u.status;
  document.getElementById('user-msg').innerHTML = '';
  populateRoleSelect(u.role);
  userModal.show();
}

function populateRoleSelect(selected) {
  document.getElementById('user-role').innerHTML = allRoles.map(r =>
    `<option value="${r.name}" ${r.name === selected ? 'selected' : ''}>${r.label}</option>`
  ).join('');
}

async function saveUser() {
  const id = document.getElementById('user-id').value;
  const body = {
    username:  document.getElementById('user-username').value.trim(),
    email:     document.getElementById('user-email').value.trim(),
    full_name: document.getElementById('user-fullname').value.trim(),
    role:      document.getElementById('user-role').value,
    status:    document.getElementById('user-status').value || 'active'
  };
  const pw = document.getElementById('user-password').value;
  if (pw) body.password = pw;
  const msg = document.getElementById('user-msg');
  const btn = document.getElementById('user-save-btn');
  if (!body.username || !body.role) { msg.innerHTML = '<span class="text-danger">Username and role are required</span>'; return; }
  if (!id && !pw) { msg.innerHTML = '<span class="text-danger">Password is required for new users</span>'; return; }
  btn.disabled = true;
  const res  = await fetch(id ? `/api/admin-users/${id}` : '/api/admin-users', {
    method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json();
  btn.disabled = false;
  if (data.success) {
    msg.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>${data.message}</span>`;
    setTimeout(() => { userModal.hide(); loadUsers(); }, 900);
  } else {
    msg.innerHTML = `<span class="text-danger">${data.message}</span>`;
  }
}

async function deleteUser(id, username) {
  if (!confirm('Delete admin account @' + username + '?')) return;
  const res  = await fetch('/api/admin-users/' + id, { method: 'DELETE' });
  const data = await res.json();
  if (data.success) loadUsers(); else alert(data.message);
}

/* ── ROLES ── */
async function loadRoles() {
  const res  = await fetch('/api/admin-roles');
  const data = await res.json();
  if (!data.success) return;
  allRoles = data.roles;
  const grid = document.getElementById('roles-grid');
  grid.innerHTML = data.roles.map(r => {
    const perms = typeof r.permissions === 'string' ? JSON.parse(r.permissions) : r.permissions;
    const badges = perms.map(p => `<span class="badge bg-light text-dark border me-1 mb-1" style="font-size:.7rem">${p}</span>`).join('');
    const isDefault = ['super_admin'].includes(r.name);
    return `<div class="col-12 col-md-6"><div class="admin-widget h-100">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <div><span class="role-badge role-${r.name}">${r.label}</span><div style="font-size:.72rem;color:var(--text-muted);margin-top:.2rem">${r.name}</div></div>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-outline-primary" onclick='editRole(${JSON.stringify(r)})'><i class="bi bi-pencil"></i></button>
          ${!isDefault ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteRole(${r.id},'${r.name}')"><i class="bi bi-trash"></i></button>` : ''}
        </div>
      </div>
      <div>${badges}</div>
    </div></div>`;
  }).join('');
}

function openRoleModal() {
  document.getElementById('roleModalTitle').textContent = 'New Role';
  document.getElementById('role-id').value = '';
  document.getElementById('role-name').value = '';
  document.getElementById('role-label').value = '';
  document.getElementById('role-name').disabled = false;
  document.getElementById('role-msg').innerHTML = '';
  buildPermsGrid([]);
  roleModal.show();
}

function editRole(r) {
  document.getElementById('roleModalTitle').textContent = 'Edit: ' + r.label;
  document.getElementById('role-id').value = r.id;
  document.getElementById('role-name').value = r.name;
  document.getElementById('role-label').value = r.label;
  document.getElementById('role-name').disabled = true;
  document.getElementById('role-msg').innerHTML = '';
  const perms = typeof r.permissions === 'string' ? JSON.parse(r.permissions) : r.permissions;
  buildPermsGrid(perms);
  roleModal.show();
}

function buildPermsGrid(selected) {
  document.getElementById('perms-grid').innerHTML = allMenuItems.map(item =>
    `<div class="col-6 col-md-4"><label class="perm-toggle">
      <input type="checkbox" value="${item.key_name}" ${selected.includes(item.key_name) ? 'checked' : ''}>
      <i class="bi ${item.icon}"></i> ${item.label}
    </label></div>`
  ).join('');
}

async function saveRole() {
  const id    = document.getElementById('role-id').value;
  const name  = document.getElementById('role-name').value.trim();
  const label = document.getElementById('role-label').value.trim();
  const perms = [...document.querySelectorAll('#perms-grid input:checked')].map(el => el.value);
  const msg   = document.getElementById('role-msg');
  if (!label) { msg.innerHTML = '<span class="text-danger">Label is required</span>'; return; }
  if (!perms.length) { msg.innerHTML = '<span class="text-danger">Select at least one permission</span>'; return; }
  const body = { label, permissions: perms };
  if (!id) body.name = name;
  const res  = await fetch(id ? `/api/admin-roles/${id}` : '/api/admin-roles', {
    method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.success) {
    msg.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>${data.message}</span>`;
    setTimeout(() => { roleModal.hide(); loadRoles(); }, 900);
  } else {
    msg.innerHTML = `<span class="text-danger">${data.message}</span>`;
  }
}

async function deleteRole(id, name) {
  if (!confirm('Delete role "' + name + '"?')) return;
  const res  = await fetch('/api/admin-roles/' + id, { method: 'DELETE' });
  const data = await res.json();
  if (data.success) loadRoles(); else alert(data.message);
}

/* ── MENU MANAGEMENT ── */
async function loadMenuItems() {
  const res  = await fetch('/api/admin-menu/all');
  const data = await res.json();
  if (!data.success) return;
  allMenuItems = data.menu;
  renderMenuList(data.menu);
}

function renderMenuList(items) {
  const list = document.getElementById('menu-list');
  list.innerHTML = items.map((item, idx) => `
    <div class="menu-row" data-id="${item.id}">
      <div class="d-flex flex-column gap-1">
        <button class="btn btn-sm btn-outline-secondary p-0" style="width:26px;height:22px" onclick="moveItem(${idx},-1)" ${idx===0?'disabled':''}><i class="bi bi-chevron-up" style="font-size:.65rem"></i></button>
        <button class="btn btn-sm btn-outline-secondary p-0" style="width:26px;height:22px" onclick="moveItem(${idx},1)" ${idx===items.length-1?'disabled':''}><i class="bi bi-chevron-down" style="font-size:.65rem"></i></button>
      </div>
      <div class="form-check form-switch mb-0 ms-1">
        <input class="form-check-input" type="checkbox" role="switch" ${item.is_active ? 'checked' : ''} onchange="toggleMenu(${item.id}, this.checked)" style="width:2.2em;height:1.2em;cursor:pointer">
      </div>
      <i class="bi ${item.icon}" style="font-size:1.1rem;width:20px;text-align:center"></i>
      <span style="flex:1;font-weight:500">${item.label}</span>
      <span class="d-none d-md-inline" style="font-size:.75rem;color:var(--text-muted)">${item.href}</span>
      <button class="btn btn-sm btn-outline-secondary" onclick='openMenuModal(${JSON.stringify(item)})'><i class="bi bi-pencil"></i></button>
    </div>`).join('');
}

function moveItem(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= allMenuItems.length) return;
  const tmp = allMenuItems[idx];
  allMenuItems[idx] = allMenuItems[newIdx];
  allMenuItems[newIdx] = tmp;
  renderMenuList(allMenuItems);
}

function dragStart(e) {
  dragSrc = e.currentTarget;
  dragSrc.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const target = e.currentTarget;
  if (target !== dragSrc) {
    const list = document.getElementById('menu-list');
    const rows = [...list.querySelectorAll('.menu-row')];
    const srcIdx = rows.indexOf(dragSrc);
    const tgtIdx = rows.indexOf(target);
    if (srcIdx < tgtIdx) list.insertBefore(dragSrc, target.nextSibling);
    else list.insertBefore(dragSrc, target);
  }
}

function dropItem(e) { e.preventDefault(); }
function dragEnd(e) { dragSrc.classList.remove('dragging'); dragSrc = null; }

async function saveMenuOrder() {
  const order = allMenuItems.map((item, i) => ({ id: item.id, order_num: i + 1 }));
  const res  = await fetch('/api/admin-menu/reorder', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ order })
  });
  const data = await res.json();
  if (data.success) {
    const btn = document.querySelector('[onclick="saveMenuOrder()"]');
    btn.innerHTML = '<i class="bi bi-check-circle me-1"></i>Saved!';
    setTimeout(() => { btn.innerHTML = '<i class="bi bi-floppy me-1"></i>Save Order'; loadMenuItems(); }, 1500);
  }
}

async function toggleMenu(id, active) {
  const item = allMenuItems.find(m => String(m.id) === String(id));
  if (!item) { console.log('item not found', id, allMenuItems.map(m=>m.id)); return; }
  item.is_active = active ? 1 : 0;
  const res = await fetch('/api/admin-menu/' + id, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ label: item.label, icon: item.icon, href: item.href, order_num: item.order_num, is_active: active ? 1 : 0 })
  });
  const data = await res.json();
  if (!data.success) alert('Failed: ' + (data.error || data.message));
}

function openMenuModal(item) {
  document.getElementById('menu-id').value = item.id;
  document.getElementById('menu-label').value = item.label;
  document.getElementById('menu-icon').value = item.icon;
  document.getElementById('menu-icon-preview').className = 'bi ' + item.icon;
  document.getElementById('menu-href').value = item.href;
  document.getElementById('menu-msg').innerHTML = '';
  menuModal.show();
}

async function saveMenuItem() {
  const id    = document.getElementById('menu-id').value;
  const label = document.getElementById('menu-label').value.trim();
  const icon  = document.getElementById('menu-icon').value.trim();
  const href  = document.getElementById('menu-href').value.trim();
  const item  = allMenuItems.find(m => m.id == id);
  const msg   = document.getElementById('menu-msg');
  if (!label || !icon || !href) { msg.innerHTML = '<span class="text-danger">All fields required</span>'; return; }
  const res = await fetch('/api/admin-menu/' + id, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ label, icon, href, order_num: item?.order_num || 0, is_active: item?.is_active ?? 1 })
  });
  const data = await res.json();
  if (data.success) {
    msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle me-1"></i>Saved</span>';
    setTimeout(() => { menuModal.hide(); loadMenuItems(); }, 900);
  } else {
    msg.innerHTML = `<span class="text-danger">${data.message}</span>`;
  }
}
</script>
