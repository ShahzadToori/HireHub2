<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Meta Tags – JobOrbit Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/JobOrbitFavicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    .meta-page-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .meta-page-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .85rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .meta-page-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(15,98,254,.1);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .meta-page-title { font-weight: 700; font-size: .9rem; color: var(--text-primary); }
    .meta-page-url   { font-size: .75rem; color: var(--text-muted); font-family: monospace; }
    .meta-page-body  { padding: 1rem 1.25rem; }

    .char-count { font-size: .72rem; text-align: right; margin-top: .2rem; }
    .char-count.warn { color: #f59e0b; }
    .char-count.over { color: #ef4444; font-weight: 700; }
    .char-count.ok   { color: var(--text-muted); }

    .serp-preview {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .75rem 1rem;
      margin-top: .75rem;
      font-size: .82rem;
    }
    .serp-title { color: #1a0dab; font-size: .95rem; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .serp-url   { color: #006621; font-size: .78rem; margin: .1rem 0; }
    .serp-desc  { color: #545454; font-size: .82rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    [data-theme=dark] .serp-title { color: #8ab4f8; }
    [data-theme=dark] .serp-url   { color: #81c995; }
    [data-theme=dark] .serp-desc  { color: #bdc1c6; }

    .tip-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .6rem 1rem; font-size: .78rem; color: var(--text-muted); margin-bottom: 1.5rem; }
    .tip-box strong { color: var(--text-primary); }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="admin-sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="/JobOrbitFavicon.svg" alt="JobOrbit" class="sidebar-brand" style="height:40px">
    <span class="sidebar-brand">JobOrbit</span>
    <button class="btn-sidebar-close d-lg-none" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
  </div>
  <nav class="sidebar-nav">
    <!-- links injected by admin.js -->
    <hr class="sidebar-divider">
    <a href="/" class="sidebar-link" target="_blank"><i class="bi bi-box-arrow-up-right"></i><span>View Site</span></a>
    <button class="sidebar-link sidebar-btn" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></button>
  </nav>
</aside>
<div class="sidebar-overlay d-lg-none d-none" id="sidebarOverlay"></div>

<!-- Main -->
<div class="admin-main">
  <header class="admin-topbar">
    <button class="btn-hamburger d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
    <h1 class="topbar-title"><i class="bi bi-tags me-2"></i>Page Meta Tags</h1>
    <div class="topbar-right">
      <button class="btn-icon-admin" id="themeToggleAdmin" title="Toggle theme">
        <i class="bi bi-moon-fill" id="themeIcon"></i>
      </button>
    </div>
  </header>

  <div class="admin-content">

    <!-- Alert -->
    <div id="metaAlert" class="alert d-none mb-3" role="alert"></div>

    <!-- Action bar -->
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-primary" onclick="saveAll()">
        <i class="bi bi-floppy me-1"></i>Save All
      </button>
      <button class="btn btn-outline-secondary" onclick="flushCache()" title="Apply changes immediately without waiting 5 minutes">
        <i class="bi bi-arrow-clockwise me-1"></i>Flush Cache
      </button>
    </div>

    <!-- Tips -->
    <div class="tip-box">
      <strong>Title:</strong> 50–60 characters ideal. Include your main keyword near the start.
      &nbsp;|&nbsp;
      <strong>Description:</strong> 120–158 characters. Write for humans — this is what shows in Google results.
      &nbsp;|&nbsp;
      Leave blank to use the page's default title/description.
    </div>

    <!-- Pages -->
    <div id="pagesContainer">
      <div style="text-align:center;padding:3rem;color:var(--text-muted)">
        <div class="spinner-border spinner-border-sm text-primary"></div>
      </div>
    </div>

    <!-- Save button (bottom) -->
    <div class="d-flex gap-2 justify-content-end mt-3">
      <button class="btn btn-outline-secondary" onclick="flushCache()">
        <i class="bi bi-arrow-clockwise me-1"></i>Flush Cache
      </button>
      <button class="btn btn-primary" onclick="saveAll()">
        <i class="bi bi-floppy me-1"></i>Save All Changes
      </button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
'use strict';

const PAGES = [
  { key:'meta_home',       label:'Homepage',       url:'/',                     icon:'bi-house'           },
  { key:'meta_about',      label:'About Us',        url:'/about.html',           icon:'bi-info-circle'     },
  { key:'meta_blog',       label:'Blog',            url:'/blog/',                icon:'bi-journal-richtext'},
  { key:'meta_tools',      label:'Tools',           url:'/tools/',               icon:'bi-tools'           },
  { key:'meta_feedback',   label:'Contact/Feedback',url:'/feedback.html',        icon:'bi-chat-dots'       },
  { key:'meta_privacy',    label:'Privacy Policy',  url:'/privacy-policy.html',  icon:'bi-shield-lock'     },
  { key:'meta_terms',      label:'Terms & Conditions',url:'/terms.html',         icon:'bi-file-text'       },
  { key:'meta_disclaimer', label:'Disclaimer',      url:'/disclaimer.html',      icon:'bi-exclamation-circle'},
];

const SITE_URL = 'https://joborbit.org';

document.addEventListener('DOMContentLoaded', () => {
  requireAuth().then(() => loadSettings());
});

async function loadSettings() {
  try {
    const data = await fetch('/api/settings').then(r => r.json());
    const s = data.settings || {};
    renderPages(s);
  } catch(e) { showAlert('Failed to load settings', 'danger'); }
}

function renderPages(s) {
  const container = document.getElementById('pagesContainer');
  container.innerHTML = PAGES.map(page => `
    <div class="meta-page-card">
      <div class="meta-page-header">
        <div class="meta-page-icon"><i class="bi ${page.icon}"></i></div>
        <div>
          <div class="meta-page-title">${page.label}</div>
          <div class="meta-page-url">${SITE_URL}${page.url}</div>
        </div>
        <a href="${page.url}" target="_blank" class="btn-icon-admin ms-auto" title="View page" style="padding:.25rem .45rem">
          <i class="bi bi-box-arrow-up-right" style="font-size:.8rem"></i>
        </a>
      </div>
      <div class="meta-page-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label-custom">
              Meta Title
              <span style="font-size:.72rem;color:var(--text-muted);font-weight:400;margin-left:.4rem">50–60 chars recommended</span>
            </label>
            <input type="text" class="form-control-custom"
              id="${page.key}_title"
              value="${escHtml(s[page.key+'_title']||'')}"
              placeholder="Leave blank to use page default"
              oninput="updateCharCount('${page.key}_title', this.value, 60)"
              onkeyup="updatePreview('${page.key}')">
            <div id="${page.key}_title_count" class="char-count ok">0 / 60</div>
          </div>
          <div class="col-12">
            <label class="form-label-custom">
              Meta Description
              <span style="font-size:.72rem;color:var(--text-muted);font-weight:400;margin-left:.4rem">120–158 chars recommended</span>
            </label>
            <textarea class="form-control-custom" rows="2"
              id="${page.key}_desc"
              placeholder="Leave blank to use page default"
              oninput="updateCharCount('${page.key}_desc', this.value, 158)"
              onkeyup="updatePreview('${page.key}')">${escHtml(s[page.key+'_desc']||'')}</textarea>
            <div id="${page.key}_desc_count" class="char-count ok">0 / 158</div>
          </div>
          <div class="col-12">
            <label class="form-label-custom">
              OG Image URL
              <span style="font-size:.72rem;color:var(--text-muted);font-weight:400;margin-left:.4rem">optional · 1200×630px · shown on WhatsApp/LinkedIn share</span>
            </label>
            <input type="url" class="form-control-custom"
              id="${page.key}_og_image"
              value="${escHtml(s[page.key+'_og_image']||'')}"
              placeholder="https://joborbit.org/images/share-preview.jpg">
            <small class="text-muted">Leave blank to use the site-wide OG image from SEO Settings.</small>
          </div>
        </div>

        <!-- SERP Preview -->
        <div class="serp-preview" id="${page.key}_preview">
          <div class="serp-title" id="${page.key}_prev_title">${escHtml(s[page.key+'_title']||page.label+' | JobOrbit Gulf')}</div>
          <div class="serp-url">${SITE_URL}${page.url}</div>
          <div class="serp-desc" id="${page.key}_prev_desc">${escHtml(s[page.key+'_desc']||'')}</div>
        </div>
      </div>
    </div>
  `).join('');

  // Init char counts
  PAGES.forEach(page => {
    updateCharCount(page.key+'_title', s[page.key+'_title']||'', 60);
    updateCharCount(page.key+'_desc',  s[page.key+'_desc']||'',  158);
  });
}

function updateCharCount(id, val, max) {
  const el = document.getElementById(id+'_count');
  if (!el) return;
  const len = val.length;
  el.textContent = `${len} / ${max}`;
  el.className = 'char-count ' + (len > max ? 'over' : len > max*.85 ? 'warn' : 'ok');
}

function updatePreview(key) {
  const title = document.getElementById(key+'_title')?.value || '';
  const desc  = document.getElementById(key+'_desc')?.value  || '';
  const page  = PAGES.find(p => p.key === key);
  const titleEl = document.getElementById(key+'_prev_title');
  const descEl  = document.getElementById(key+'_prev_desc');
  if (titleEl) titleEl.textContent = title || (page ? page.label + ' | JobOrbit Gulf' : '');
  if (descEl)  descEl.textContent  = desc;
}

async function flushCache() {
  try {
    const data = await adminApi.post('/api/settings/flush-meta-cache', {});
    showAlert(data.success ? 'Cache flushed — changes now live immediately.' : 'Flush failed', data.success ? 'success' : 'danger');
  } catch { showAlert('Error flushing cache', 'danger'); }
}

async function saveAll() {
  const body = {};
  PAGES.forEach(page => {
    body[page.key+'_title']    = (document.getElementById(page.key+'_title')?.value    || '').trim();
    body[page.key+'_desc']     = (document.getElementById(page.key+'_desc')?.value     || '').trim();
    body[page.key+'_og_image'] = (document.getElementById(page.key+'_og_image')?.value || '').trim();
  });

  try {
    const data = await adminApi.put('/api/settings', body);
    if (data.success) {
      showAlert('Meta tags saved! Changes will appear on the site within 5 minutes.', 'success');
    } else {
      showAlert(data.message || 'Failed to save', 'danger');
    }
  } catch(e) { showAlert('Error saving meta tags', 'danger'); }
}

function showAlert(msg, type) {
  const el = document.getElementById('metaAlert');
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.classList.remove('d-none');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('d-none'), 5000);
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
</body>
</html>
