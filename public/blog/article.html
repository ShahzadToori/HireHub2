<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Article – JobOrbit Blog</title>
  <meta name="description" id="page-desc" content="">
  <meta property="og:type" content="article">
  <meta property="og:title" id="og-title" content="">
  <meta property="og:description" id="og-desc" content="">
  <meta property="og:image" id="og-image" content="">
  <meta property="og:site_name" content="JobOrbit">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" id="page-canonical" href="">
  <link rel="icon" type="image/png" href="/JobOrbitFavicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f62fe">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
  .blog-hero{background:linear-gradient(135deg,#0d1117 0%,#161b22 55%,#0f2744 100%);padding:4rem 0 3rem;position:relative;overflow:hidden}
  .blog-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(15,98,254,.2),transparent 70%)}
  .blog-hero-inner{position:relative;text-align:center}
  .blog-hero-badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(15,98,254,.2);border:1px solid rgba(15,98,254,.35);border-radius:100px;padding:.3rem .9rem;font-size:.75rem;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:1rem}
  .blog-hero-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.8rem,4.5vw,3rem);color:#fff;line-height:1.15;margin-bottom:.75rem}
  .blog-hero-sub{color:rgba(255,255,255,.6);font-size:.95rem;max-width:580px;margin:0 auto}
  .blog-hero-meta{display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:1.25rem;flex-wrap:wrap}
  .blog-hero-meta span{font-size:.78rem;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:.3rem}
  .article-body h2{font-family:'Syne',sans-serif;font-weight:700;font-size:1.35rem;color:var(--text-primary);margin:2rem 0 .75rem;padding-bottom:.4rem;border-bottom:2px solid var(--border)}
  .article-body h3{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;color:var(--text-primary);margin:1.5rem 0 .5rem}
  .article-body p{color:var(--text-secondary);font-size:.95rem;line-height:1.8;margin-bottom:1rem}
  .article-body ul,.article-body ol{color:var(--text-secondary);font-size:.95rem;line-height:1.8;padding-left:1.5rem;margin-bottom:1rem}
  .article-body li{margin-bottom:.4rem}
  .article-body strong{color:var(--text-primary);font-weight:600}
  .article-body a{color:var(--primary)}
  .article-body img{max-width:100%;border-radius:10px;margin:1rem 0}
  .article-body table{width:100%;border-collapse:collapse;margin:1rem 0 1.5rem}
  .article-body table th{background:var(--primary);color:#fff;padding:.65rem 1rem;font-family:'Syne',sans-serif;font-size:.8rem;text-align:left}
  .article-body table td{padding:.6rem 1rem;border-bottom:1px solid var(--border);font-size:.875rem;color:var(--text-secondary)}
  .article-body table tr:last-child td{border-bottom:none}
  .article-body table tr:nth-child(even) td{background:var(--surface)}
  .article-highlight{background:rgba(15,98,254,.06);border-left:3px solid var(--primary);border-radius:0 10px 10px 0;padding:1rem 1.25rem;margin:1.5rem 0}
  [data-theme="dark"] .article-highlight{background:rgba(15,98,254,.1)}
  .article-highlight p{margin:0;font-size:.9rem;color:var(--text-secondary)}
  .sidebar-widget{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1.25rem}
  .sidebar-widget-title{font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:1rem}
  .rel-link{display:flex;align-items:flex-start;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--border);text-decoration:none}
  .rel-link:last-child{border-bottom:none}
  .rel-link:hover .rel-title{color:var(--primary)}
  .rel-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
  .rel-title{font-size:.83rem;font-weight:600;color:var(--text-primary);line-height:1.3;transition:color .15s}
  .rel-cat{font-size:.72rem;color:var(--text-muted);margin-top:.1rem}
  .cta-widget{background:linear-gradient(135deg,#0f62fe,#0353e9);border-radius:14px;padding:1.5rem;text-align:center}
  .cta-widget h5{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:#fff;margin-bottom:.5rem}
  .cta-widget p{font-size:.82rem;color:rgba(255,255,255,.85);margin-bottom:1rem}
  .cta-widget a{background:#fff;color:#0f62fe;border-radius:8px;padding:.5rem 1.25rem;font-size:.85rem;font-weight:700;text-decoration:none;display:inline-block}
  .breadcrumb-bar{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--text-muted);margin-bottom:1.5rem;flex-wrap:wrap}
  .breadcrumb-bar a{color:var(--text-muted);text-decoration:none}
  .breadcrumb-bar a:hover{color:var(--primary)}
  .article-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0}
  .article-tag{background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:.2rem .75rem;font-size:.75rem;color:var(--text-muted);text-decoration:none;transition:all .15s}
  .article-tag:hover{border-color:var(--primary);color:var(--primary)}
  .share-row{display:flex;align-items:center;gap:.75rem;padding:1rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:1.5rem 0;flex-wrap:wrap}
  .share-label{font-weight:700;font-size:.85rem;color:var(--text-primary)}
  .share-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .85rem;border-radius:8px;font-size:.8rem;font-weight:600;text-decoration:none;border:1px solid var(--border);color:var(--text-primary);background:var(--bg-card);cursor:pointer;transition:all .15s}
  .share-btn:hover{transform:translateY(-1px)}
  .share-btn.wa{color:#25d366}
  .share-btn.tg{color:#0088cc}
  .draft-banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:.75rem 1rem;color:#d97706;font-size:.85rem;font-weight:600;margin-bottom:1.5rem;display:flex;align-items:center;gap:.5rem}
  .featured-img{width:100%;border-radius:12px;margin-bottom:1.5rem;object-fit:cover;max-height:400px}
  </style>
</head>
<body>
<!-- NAVBAR -->

<section class="blog-hero">
  <div class="container blog-hero-inner">
    <div class="breadcrumb-bar" style="justify-content:center;margin-bottom:.75rem">
      <a href="/" style="color:rgba(255,255,255,.45)">Home</a>
      <i class="bi bi-chevron-right" style="font-size:.65rem;color:rgba(255,255,255,.3)"></i>
      <a href="/blog/" onclick="if(document.referrer.includes('/blog/')){event.preventDefault();history.back();}" style="color:rgba(255,255,255,.45)">Blog</a>
      <i class="bi bi-chevron-right" style="font-size:.65rem;color:rgba(255,255,255,.3)"></i>
      <span id="hero-category" style="color:rgba(255,255,255,.45)">Article</span>
    </div>
    <div class="blog-hero-badge" id="hero-badge"><i class="bi bi-journal-text me-1"></i>Article</div>
    <h1 class="blog-hero-title" id="article-title">Loading…</h1>
    <p class="blog-hero-sub" id="article-excerpt"></p>
    <div class="blog-hero-meta">
      <span><i class="bi bi-clock"></i><span id="article-rt">—</span> min read</span>
      <span><i class="bi bi-calendar3"></i><span id="article-date">—</span></span>
      <span><i class="bi bi-person"></i><span id="article-author">—</span></span>
      <span><i class="bi bi-eye"></i><span id="article-views">—</span> views</span>
    </div>
  </div>
</section>

<div class="container py-5">
  <div id="draft-notice" class="draft-banner d-none">
    <i class="bi bi-eye-slash-fill"></i> This article is a draft — only visible to admins
  </div>
  <div class="row g-4 g-lg-5">

    <!-- Main content -->
    <div class="col-lg-8">
      <div class="breadcrumb-bar">
        <a href="/blog/" onclick="if(document.referrer.includes('/blog/')){event.preventDefault();history.back();}"><i class="bi bi-arrow-left me-1"></i>Back to Blog</a>
      </div>
      <img id="featured-img" class="featured-img d-none" src="" alt="">
      <article class="article-body" id="article-content"></article>

      <!-- Tags -->
      <div class="article-tags" id="article-tags"></div>

      <!-- Share -->
      <div class="share-row">
        <span class="share-label"><i class="bi bi-share-fill me-1"></i>Share</span>
        <a class="share-btn wa" id="share-wa" href="#" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i> WhatsApp</a>
        <a class="share-btn tg" id="share-tg" href="#" target="_blank" rel="noopener"><i class="bi bi-telegram"></i> Telegram</a>
        <button class="share-btn" id="share-copy" onclick="copyLink()"><i class="bi bi-link-45deg"></i> Copy Link</button>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="col-lg-4">
      <div style="position:sticky;top:80px;padding-top:1rem">
        <div class="sidebar-widget">
          <div class="sidebar-widget-title">More Articles</div>
          <div id="related-list">
            <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary"></div></div>
          </div>
        </div>
        <div class="cta-widget">
          <h5>Find your next job</h5>
          <p>Browse verified listings in Saudi Arabia and the Gulf. Apply directly.</p>
          <a href="/">Browse Jobs Now</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->

<script>
const slug = window.location.pathname.replace(/^\/blog\/?/, '').replace(/\/$/, '');

const iconMap = {
  'Job Search':       'bi-search',
  'Resume & CV':      'bi-file-earmark-text',
  'Interview Tips':   'bi-person-workspace',
  'Career Growth':    'bi-graph-up-arrow',
  'Gulf Market':      'bi-globe2',
  'Salary & Benefits':'bi-currency-dollar',
  'Visa & Iqama':     'bi-passport',
  'General':          'bi-journal-text',
  'Expat Life':       'bi-globe2',
};
const colorMap = {
  'Job Search':       'rgba(15,98,254,.1)',
  'Resume & CV':      'rgba(245,158,11,.1)',
  'Interview Tips':   'rgba(99,102,241,.1)',
  'Career Growth':    'rgba(249,115,22,.1)',
  'Gulf Market':      'rgba(6,182,212,.1)',
  'Salary & Benefits':'rgba(16,185,129,.1)',
  'Visa & Iqama':     'rgba(139,92,246,.1)',
  'General':          'rgba(15,98,254,.1)',
  'Expat Life':       'rgba(6,182,212,.1)',
};
const fgMap = {
  'Job Search':       '#0f62fe',
  'Resume & CV':      '#d97706',
  'Interview Tips':   '#6366f1',
  'Career Growth':    '#ea580c',
  'Gulf Market':      '#0891b2',
  'Salary & Benefits':'#059669',
  'Visa & Iqama':     '#7c3aed',
  'General':          '#0f62fe',
  'Expat Life':       '#0891b2',
};

async function loadArticle() {
  try {
    const res  = await fetch('/api/blog/' + slug);
    const data = await res.json();

    if (!res.ok || !data.success) {
      document.getElementById('article-title').textContent = 'Article not found';
      document.getElementById('article-content').innerHTML = '<p>This article could not be found. <a href="/blog/" onclick="if(document.referrer.includes('/blog/')){event.preventDefault();history.back();}">Back to Blog</a></p>';
      return;
    }

    const a = data.article;

    // Meta tags
    document.getElementById('page-title').textContent     = (a.meta_title || a.title) + ' – JobOrbit Blog';
    document.getElementById('page-desc').content          = a.meta_description || a.excerpt || '';
    document.getElementById('og-title').content           = a.meta_title || a.title;
    document.getElementById('og-desc').content            = a.meta_description || a.excerpt || '';
    document.getElementById('og-image').content           = a.featured_image || '/images/icon-512x512.svg';
    document.getElementById('page-canonical').href        = window.location.href;

    // Hero
    const cat = a.category || 'General';
    document.getElementById('article-title').textContent  = a.title;
    document.getElementById('article-excerpt').textContent = a.excerpt || '';
    document.getElementById('hero-category').textContent  = cat;
    document.getElementById('hero-badge').innerHTML       = `<i class="bi ${iconMap[cat]||'bi-journal-text'} me-1"></i>${cat}`;
    document.getElementById('article-rt').textContent     = a.reading_time;
    document.getElementById('article-author').textContent = a.author;
    document.getElementById('article-views').textContent  = (a.views||0).toLocaleString();
    document.getElementById('article-date').textContent   = new Date(a.published_at||a.created_at).toLocaleDateString('en-US',{month:'long',year:'numeric'});

    // Draft notice
    if (a.status === 'draft') document.getElementById('draft-notice').classList.remove('d-none');

    // Featured image
    if (a.featured_image) {
      const img = document.getElementById('featured-img');
      img.src = a.featured_image; img.alt = a.title;
      img.classList.remove('d-none');
    }

    // Content
    document.getElementById('article-content').innerHTML = a.content;

    // Tags
    if (a.tags) {
      const wrap = document.getElementById('article-tags');
      a.tags.split(',').filter(Boolean).forEach(t => {
        wrap.innerHTML += `<a href="/blog/?tag=${encodeURIComponent(t.trim())}" class="article-tag">#${t.trim()}</a>`;
      });
    }

    // Share links
    const url  = encodeURIComponent(window.location.href);
    const text = encodeURIComponent(a.title + ' – JobOrbit Blog');
    document.getElementById('share-wa').href = 'https://wa.me/?text=' + text + '%20' + url;
    document.getElementById('share-tg').href = 'https://t.me/share/url?url=' + url + '&text=' + text;

    // Related articles in sidebar
    renderRelated(data.related || []);

    // Structured data
    const schema = {
      "@context":"https://schema.org","@type":"BlogPosting",
      "headline":a.title,"description":a.excerpt||'',
      "image":a.featured_image||'',
      "author":{"@type":"Person","name":a.author},
      "publisher":{"@type":"Organization","name":"JobOrbit"},
      "datePublished":a.published_at||a.created_at,
      "dateModified":a.updated_at||a.created_at
    };
    const sd = document.createElement('script');
    sd.type='application/ld+json'; sd.textContent=JSON.stringify(schema);
    document.head.appendChild(sd);

  } catch(err) {
    console.error(err);
    document.getElementById('article-title').textContent = 'Failed to load article';
  }
}

function renderRelated(articles) {
  const list = document.getElementById('related-list');
  if (!articles.length) {
    list.innerHTML = '<p style="font-size:.82rem;color:var(--text-muted)">No related articles yet.</p>';
    return;
  }
  list.innerHTML = articles.map(r => {
    const cat  = r.category||'General';
    const icon = iconMap[cat]||'bi-journal-text';
    const bg   = colorMap[cat]||'rgba(15,98,254,.1)';
    const fg   = fgMap[cat]||'#0f62fe';
    return `<a href="/blog/${r.slug}" class="rel-link">
      <div class="rel-icon" style="background:${bg};color:${fg}"><i class="bi ${icon}"></i></div>
      <div><div class="rel-title">${r.title}</div><div class="rel-cat">${cat}</div></div>
    </a>`;
  }).join('');
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = document.getElementById('share-copy');
    btn.innerHTML = '<i class="bi bi-check-lg"></i> Copied!';
    setTimeout(() => { btn.innerHTML = '<i class="bi bi-link-45deg"></i> Copy Link'; }, 2000);
  });
}

loadArticle();
</script>
</body>
</html>
