<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog – Career Advice & Gulf Job Market Insights | JobOrbit</title>
  <meta name="description" content="Expert guides on job hunting, resume writing, interview prep, and career growth in Saudi Arabia and the Gulf.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="/blog/">
  <link rel="icon" type="image/png" href="/JobOrbitFavicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .blog-hero{background:linear-gradient(135deg,#0d1117 0%,#161b22 60%,#0f2744 100%);padding:4rem 0 3rem;text-align:center;position:relative;overflow:hidden}
    .blog-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(15,98,254,.18) 0%,transparent 70%)}
    .blog-hero-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.75rem,4vw,2.75rem);color:#fff;margin-bottom:.6rem;position:relative}
    .blog-hero-sub{color:rgba(255,255,255,.6);font-size:.95rem;max-width:540px;margin:0 auto;position:relative}
    .cat-pill{display:inline-flex;align-items:center;padding:.35rem .9rem;border-radius:100px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none;border:none}
    .cat-pill:hover,.cat-pill.active{background:var(--primary);color:#fff;text-decoration:none}
    .blog-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;height:100%}
    .blog-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.1)}
    .blog-card-img{width:100%;height:180px;object-fit:cover}
    .blog-card-img-placeholder{width:100%;height:180px;background:linear-gradient(135deg,var(--surface),var(--border));display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--text-muted)}
    .blog-card-body{padding:1.25rem;flex:1;display:flex;flex-direction:column}
    .blog-card-cat{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);margin-bottom:.4rem}
    .blog-card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--text-primary);line-height:1.4;margin-bottom:.5rem;flex:1}
    .blog-card-excerpt{font-size:.83rem;color:var(--text-muted);line-height:1.6;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .blog-card-meta{display:flex;align-items:center;justify-content:space-between;font-size:.73rem;color:var(--text-muted);border-top:1px solid var(--border);padding-top:.75rem;margin-top:auto}
    .blog-card-link{display:block;text-decoration:none;height:100%}
    .featured-card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:transform .18s,box-shadow .18s}
    .featured-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
    .featured-card img{width:100%;height:320px;object-fit:cover}
    @media(max-width:768px){.featured-card img{height:220px}}
    .featured-card-body{padding:1.75rem}
    .featured-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.25rem,3vw,1.75rem);color:var(--text-primary);line-height:1.3;margin-bottom:.65rem}
    .search-bar{display:flex;gap:.5rem;margin-bottom:1.5rem}
    .search-bar input{flex:1;padding:.6rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text-primary);font-size:.9rem}
    .search-bar input:focus{outline:none;border-color:var(--primary)}
  </style>
</head>
<body>
<!-- NAVBAR -->
<section class="blog-hero">
  <div class="container position-relative">
    <div style="width:56px;height:56px;border-radius:16px;background:rgba(15,98,254,.2);border:1px solid rgba(15,98,254,.35);display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;color:#60a5fa;margin-bottom:1rem"><i class="bi bi-journal-richtext"></i></div>
    <h1 class="blog-hero-title">Career Advice & Job Market Insights</h1>
    <p class="blog-hero-sub">Expert guides on job hunting, resume writing, interview prep, and career growth in Saudi Arabia and the Gulf.</p>
  </div>
</section>
<section class="py-5">
  <div class="container">
    <div id="featured-wrap" class="mb-5 d-none">
      <a id="featured-link" href="#" class="featured-card d-block text-decoration-none">
        <img id="featured-img" src="" alt="" style="display:none">
        <div class="featured-card-body">
          <div id="featured-cat" style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);margin-bottom:.4rem"></div>
          <h2 class="featured-title" id="featured-title"></h2>
          <p class="text-muted" id="featured-excerpt" style="font-size:.92rem"></p>
          <div class="d-flex align-items-center gap-3 mt-2" style="font-size:.8rem;color:var(--text-muted)">
            <span><i class="bi bi-person me-1"></i><span id="featured-author"></span></span>
            <span><i class="bi bi-clock me-1"></i><span id="featured-rt"></span> min read</span>
          </div>
        </div>
      </a>
    </div>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search articles…" oninput="debounceSearch()">
        </div>
        <div class="d-flex flex-wrap gap-2 mb-4" id="cat-filters"></div>
        <div class="row g-3" id="articles-grid"></div>
        <div class="d-none text-center py-5" id="empty-state">
          <i class="bi bi-search fs-1 text-muted mb-3 d-block"></i>
          <p class="text-muted">No articles found</p>
        </div>
        <nav class="mt-4"><ul class="pagination justify-content-center" id="pagination"></ul></nav>
      </div>
      <div class="col-lg-4">
        <div class="sidebar-widget">
          <h5 class="widget-title">Categories</h5>
          <ul class="list-unstyled mb-0" id="sidebar-cats"></ul>
        </div>
        <div class="sidebar-widget mt-3">
          <h5 class="widget-title">Job Alerts</h5>
          <p class="text-muted small">Get new Gulf jobs delivered to your inbox.</p>
          <a href="/" class="btn btn-primary w-100"><i class="bi bi-briefcase-fill me-1"></i>Browse Jobs</a>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- FOOTER -->
<script>
let currentPage=1,currentCat='',currentSearch='',searchTimer;
const PER_PAGE=9;
async function loadArticles(page=1){
  currentPage=page;
  const grid=document.getElementById('articles-grid');
  const empty=document.getElementById('empty-state');
  grid.innerHTML='<div class="col-12 text-center py-4"><div class="spinner-border text-primary"></div></div>';
  empty.classList.add('d-none');
  const params=new URLSearchParams({page,limit:PER_PAGE});
  if(currentCat) params.set('category',currentCat);
  if(currentSearch) params.set('search',currentSearch);
  const res=await fetch('/api/blog?'+params);
  const data=await res.json();
  grid.innerHTML='';
  if(!data.articles?.length){empty.classList.remove('d-none');buildPagination(0);return;}
  data.articles.forEach(a=>{
    const img=a.featured_image
      ?`<img src="${a.featured_image}" alt="${a.title}" class="blog-card-img" loading="lazy">`
      :`<div class="blog-card-img-placeholder"><i class="bi bi-journal-text"></i></div>`;
    const date=new Date(a.published_at||a.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    grid.innerHTML+=`<div class="col-md-6"><a href="/blog/${a.slug}" class="blog-card-link"><div class="blog-card">${img}<div class="blog-card-body"><div class="blog-card-cat">${a.category}</div><div class="blog-card-title">${a.title}</div><div class="blog-card-excerpt">${a.excerpt||''}</div><div class="blog-card-meta"><span><i class="bi bi-clock me-1"></i>${a.reading_time} min</span><span>${date}</span></div></div></div></a></div>`;
  });
  buildPagination(data.pages);
}
function buildPagination(pages){
  const pag=document.getElementById('pagination');
  pag.innerHTML='';
  if(pages<=1)return;

  // Prev button
  pag.innerHTML+=`<li class="page-item ${currentPage===1?'disabled':''}">
    <button class="page-link" onclick="changePage(${currentPage-1})">&laquo;</button></li>`;

  // Show max 5 page numbers around current
  let start=Math.max(1,currentPage-2);
  let end=Math.min(pages,start+4);
  if(end-start<4)start=Math.max(1,end-4);

  if(start>1)pag.innerHTML+=`<li class="page-item"><button class="page-link" onclick="changePage(1)">1</button></li>
    ${start>2?'<li class="page-item disabled"><span class="page-link">…</span></li>':''}`;

  for(let i=start;i<=end;i++)
    pag.innerHTML+=`<li class="page-item ${i===currentPage?'active':''}">
      <button class="page-link" onclick="changePage(${i})">${i}</button></li>`;

  if(end<pages)pag.innerHTML+=`${end<pages-1?'<li class="page-item disabled"><span class="page-link">…</span></li>':''}
    <li class="page-item"><button class="page-link" onclick="changePage(${pages})">${pages}</button></li>`;

  // Next button
  pag.innerHTML+=`<li class="page-item ${currentPage===pages?'disabled':''}">
    <button class="page-link" onclick="changePage(${currentPage+1})">&raquo;</button></li>`;
}

function changePage(page){
  if(page<1)return;
  loadArticles(page);
  // Smooth scroll to articles grid, not top of page
  const grid=document.getElementById('articles-grid');
  window.scrollTo({top:0,behavior:'smooth'});
}
async function loadCategories(){
  const res=await fetch('/api/blog/categories');
  const data=await res.json();
  if(!data.categories?.length)return;
  const filts=document.getElementById('cat-filters');
  filts.innerHTML=`<button class="cat-pill active" onclick="filterCat('',this)">All</button>`;
  data.categories.forEach(c=>{filts.innerHTML+=`<button class="cat-pill" onclick="filterCat('${c.category}',this)">${c.category} <span style="opacity:.6;font-size:.7rem">(${c.count})</span></button>`;});
  const sidebar=document.getElementById('sidebar-cats');
  data.categories.forEach(c=>{sidebar.innerHTML+=`<li style="display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.85rem"><a href="#" onclick="filterCat('${c.category}');return false" style="color:var(--text-secondary);text-decoration:none">${c.category}</a><span style="color:var(--text-muted)">${c.count}</span></li>`;});
}
async function loadFeatured(){
  const res=await fetch('/api/blog?limit=1');
  const data=await res.json();
  if(!data.articles?.length)return;
  const a=data.articles[0];
  document.getElementById('featured-wrap').classList.remove('d-none');
  document.getElementById('featured-link').href=`/blog/${a.slug}`;
  document.getElementById('featured-cat').textContent=a.category;
  document.getElementById('featured-title').textContent=a.title;
  document.getElementById('featured-excerpt').textContent=a.excerpt||'';
  document.getElementById('featured-author').textContent=a.author;
  document.getElementById('featured-rt').textContent=a.reading_time;
  if(a.featured_image){const img=document.getElementById('featured-img');img.src=a.featured_image;img.alt=a.title;img.style.display='';}
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));
  if(btn)btn.classList.add('active');
  loadArticles(1);
}
function debounceSearch(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{currentSearch=document.getElementById('searchInput').value.trim();loadArticles(1);},350);
}
loadFeatured();loadCategories();loadArticles();
</script>
</body>
</html>
