<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Job Requirement — JobOrbit</title>
  <link rel="icon" href="/JobOrbitFavicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
  body{font-family:'Source Sans 3',sans-serif;background:var(--bg)}
  .req-wrap{max-width:640px;margin:0 auto;padding:1rem 1rem 5rem}
  .req-card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:16px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .req-hero-card{text-align:left}
  .req-hero-avatar{width:64px;height:64px;border-radius:14px;background:var(--primary);color:#fff;font-family:'Lexend',sans-serif;font-weight:800;font-size:1.6rem;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .req-company-name{font-family:'Lexend',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text-primary);margin:.1rem 0 .4rem}
  .req-badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:600;padding:.2rem .55rem;border-radius:20px;background:rgba(15,98,254,.1);color:var(--primary)}
  .req-hero-stats{display:flex;justify-content:flex-start;flex-wrap:wrap;gap:.4rem 1rem;margin:1rem 0;padding:.85rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .req-stat-item{font-size:.8rem;color:var(--text-secondary);display:flex;align-items:center;gap:.25rem}
  .req-contact-btns{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
  .req-btn-phone{flex:1;min-width:120px;padding:.55rem .75rem;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-size:.85rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none;transition:all .15s}
  .req-btn-phone:hover{border-color:var(--primary);color:var(--primary)}
  .req-btn-wa{background:#25d366;color:#fff;border-color:#25d366}
  .req-btn-wa:hover{background:#1fba59;color:#fff;border-color:#1fba59}
  .req-section-title{font-family:'Lexend',sans-serif;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:.85rem}
  .pos-row{display:flex;align-items:flex-start;gap:.65rem;padding:.8rem 0;border-bottom:1px solid var(--border)}
  .pos-row:last-child{border-bottom:none}
  .pos-num{width:24px;height:24px;border-radius:6px;background:var(--surface);color:var(--text-muted);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .pos-info{flex:1;min-width:0}
  .pos-title{font-weight:600;font-size:.9rem;color:var(--text-primary);margin:0;word-break:break-word}
  .pos-meta{font-size:.75rem;color:var(--text-muted);margin:.1rem 0 0}
  .pos-count{font-size:.78rem;font-weight:700;color:var(--primary);background:rgba(15,98,254,.08);padding:.15rem .45rem;border-radius:6px;flex-shrink:0;white-space:nowrap}
  .pos-apply{padding:.4rem .85rem;border-radius:8px;background:var(--primary);color:#fff;border:none;font-size:.8rem;font-weight:600;cursor:pointer;flex-shrink:0;transition:all .15s;white-space:nowrap}
  .pos-apply:hover{background:#0050e6}
  .req-share{text-align:center;padding:.75rem 0}
  .req-share p{font-size:.8rem;color:var(--text-muted);margin-bottom:.6rem}
  .share-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  .share-btn{display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.55rem .5rem;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s}
  .share-btn:hover{border-color:var(--primary);color:var(--primary)}
  .share-btn-wa{background:#25d366;color:#fff;border-color:#25d366}
  .share-btn-wa:hover{background:#1fba59;color:#fff}
  .share-btn-tg{background:#2aabee;color:#fff;border-color:#2aabee}
  .share-btn-tg:hover{background:#1a9ede;color:#fff}
  .req-skeleton{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sk-line{height:14px;border-radius:6px;background:var(--border);margin-bottom:.6rem}

  /* Apply modal */
  .apply-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1055;display:flex;align-items:flex-end;justify-content:center}
  .apply-modal-sheet{background:var(--bg-card);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:1.5rem 1.25rem 2rem}
  .apply-sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto .75rem}
  .apply-field{margin-bottom:.85rem}
  .apply-label{font-size:.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:.3rem;display:block}
  .apply-input{width:100%;padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text-primary);font-family:'Source Sans 3',sans-serif;font-size:.88rem;outline:none;transition:border-color .15s}
  .apply-input:focus{border-color:var(--primary)}
  .apply-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .apply-submit{width:100%;padding:.7rem;border-radius:10px;background:var(--primary);color:#fff;border:none;font-family:'Source Sans 3',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:background .15s}
  .apply-submit:hover{background:#0050e6}
  .apply-submit:disabled{background:var(--text-muted);cursor:not-allowed}
  .apply-job-title{font-family:'Lexend',sans-serif;font-weight:700;font-size:1.05rem;color:var(--text-primary);margin-bottom:.2rem}
  .apply-job-meta{font-size:.78rem;color:var(--text-muted);margin-bottom:1.1rem}
  </style>
</head>
<body>
<script>
(function(){
  function applyTheme(t,save){
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.style.colorScheme=t;
    var i=document.getElementById('themeIcon');
    if(i)i.className=t==='dark'?'bi bi-sun-fill':'bi bi-moon-fill';
    if(save!==false)localStorage.setItem('theme',t);
  }
  applyTheme(localStorage.getItem('theme')||'light',false);
  document.addEventListener('DOMContentLoaded',function(){
    var btn=document.getElementById('themeToggle');
    if(btn&&!btn.dataset.themeWired){
      btn.dataset.themeWired='1';
      btn.addEventListener('click',function(){
        applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
      });
    }
  });
  window.toggleTheme=function(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');};
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/countries.js"></script>
<script>
const batchId = window.location.pathname.split('/').filter(Boolean).pop();
let batchJobs = [];
let currentJobId = null;

// Populate nationality dropdown
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('aNat');
  if (typeof COUNTRIES !== 'undefined') {
    COUNTRIES.forEach(c => {
      const o = document.createElement('option');
      o.value = c.name; o.textContent = c.flag + ' ' + c.name;
      sel.appendChild(o);
    });
  }
  loadBatch();
});

async function loadBatch() {
  try {
    const r = await fetch('/api/jobs/batch/' + batchId);
    const d = await r.json();
    if (!d.success) { showError(); return; }
    batchJobs = d.jobs;
    renderBatch(d);
  } catch(e) { showError(); }
}

function showError() {
  document.getElementById('reqLoading').style.display = 'none';
  document.getElementById('reqError').style.display = '';
}

function renderBatch(d) {
  const { jobs, employer, totalPositions } = d;
  if (!jobs.length) { showError(); return; }
  const j0 = jobs[0];
  const company = employer?.company_name || j0.company || 'Employer';

  document.title = 'Requirement — ' + company + ' — JobOrbit';

  // Logo or avatar
  const av = document.getElementById('reqAvatar');
  if (employer?.logo_url) {
    av.innerHTML = `<img src="${employer.logo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`;
    av.style.background = 'transparent';
    av.style.overflow = 'hidden';
  } else {
    av.textContent = company.charAt(0).toUpperCase();
  }

  document.getElementById('reqCompany').textContent = company;
  document.getElementById('reqLocation').textContent = j0.location || '—';
  document.getElementById('reqDate').textContent = new Date(j0.created_at).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
  document.getElementById('reqTotal').textContent = totalPositions;
  document.getElementById('reqJobCount').textContent = jobs.length + (jobs.length === 1 ? ' position' : ' positions');

  // Expiry date
  if (j0.expires_at) {
    const expEl = document.getElementById('reqExpiry');
    if (expEl) {
      const exp = new Date(j0.expires_at);
      const now = new Date();
      const daysLeft = Math.ceil((exp - now) / (1000*60*60*24));
      expEl.textContent = daysLeft > 0 ? `Expires in ${daysLeft} day${daysLeft===1?'':'s'}` : 'Expired';
      expEl.style.color = daysLeft <= 7 ? '#dc2626' : 'var(--text-muted)';
      const ew = document.getElementById('reqExpiryWrap'); if(ew) ew.style.display = '';
    }
  }

  // Contact buttons
  const btns = document.getElementById('reqContactBtns');
  if (j0.phone) btns.innerHTML += `<a href="tel:${j0.phone}" class="req-btn-phone"><i class="bi bi-telephone-fill"></i>${j0.phone}</a>`;
  if (j0.whatsapp) btns.innerHTML += `<a href="https://wa.me/${j0.whatsapp.replace(/\D/g,'')}" target="_blank" class="req-btn-phone req-btn-wa"><i class="bi bi-whatsapp"></i>WhatsApp</a>`;

  // Positions list
  const container = document.getElementById('reqPositions');
  jobs.forEach((job, i) => {
    const div = document.createElement('div');
    div.className = 'pos-row';
    div.innerHTML = `
      <span class="pos-num">${i+1}</span>
      <div class="pos-info">
        <p class="pos-title">${esc(job.title)}</p>
        <p class="pos-meta">${job.category || ''}${job.job_type ? ' · ' + job.job_type : ''}${job.salary ? ` · <i class="bi bi-cash-coin" style="color:#16a34a;font-size:.72rem"></i> ${esc(job.salary)}` : ''}</p>
        <div style="display:flex;align-items:center;gap:.5rem;margin-top:.5rem">
          <span class="pos-count">${job.positions || 1} ${(job.positions||1) > 1 ? 'Openings' : 'Opening'}</span>
          <button class="pos-apply" onclick="openApply(${job.id})">Apply Now</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  });

  // Description / Requirements card
  const descParts = [];
  if (j0.description)  descParts.push({ label: 'Description', text: j0.description });
  if (j0.requirements) descParts.push({ label: 'Requirements', text: j0.requirements });
  if (descParts.length) {
    const card = document.getElementById('reqDescCard');
    const content = document.getElementById('reqDescContent');
    if (card && content) {
      content.innerHTML = descParts.map(p =>
        `<div style="font-size:.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem">${p.label}</div>
         <div style="white-space:pre-wrap;margin-bottom:1rem">${p.text.replace(/</g,'&lt;')}</div>`
      ).join('');
      card.style.display = '';
    }
  }

  // Share links
  const cleanUrl = window.location.origin + window.location.pathname;
  const url = encodeURIComponent(cleanUrl);
  const posList = jobs.map(j => '• ' + j.title).join('\n');
  const descLine = j0.description ? '\n' + j0.description.substring(0,200).trim() + (j0.description.length>200?'...':'') + '\n' : '\n';
  const text = encodeURIComponent(
    '🔵 *URGENT REQUIREMENT*\n' +
    '*' + company + '*\n\n' +
    '📍 ' + j0.location + ' | 👥 ' + totalPositions + ' Positions\n\n' +
    '📋 *Open Positions:*\n' + posList + '\n' +
    descLine +
    '👉 ' + cleanUrl + '\n\n' +
    '_Posted via JobOrbit.org_'
  );
  document.getElementById('reqWaShare').href = 'https://wa.me/?text=' + text;
  document.getElementById('reqTgShare').href = 'https://t.me/share/url?url=' + url + '&text=' + encodeURIComponent(company + ' — ' + totalPositions + ' positions in ' + j0.location);

  document.getElementById('reqLoading').style.display = 'none';
  document.getElementById('reqMain').style.display = '';
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyReqLink() {
  const _clean = window.location.origin + window.location.pathname;
  navigator.clipboard.writeText(_clean).then(() => {
    const btn = document.getElementById('copyBtnTxt');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy Link', 2000);
  });
}

// ── Apply sheet ───────────────────────────────────────────────
async function openApply(jobId) {
  currentJobId = jobId;
  const job = batchJobs.find(j => j.id === jobId);
  if (!job) return;
  document.getElementById('applyJobTitle').textContent = job.title;
  document.getElementById('applyJobMeta').textContent = (job.location || '') + (job.job_type ? ' · ' + job.job_type : '');
  document.getElementById('applyMsg').style.display = 'none';
  document.getElementById('applySubmitBtn').disabled = false;
  document.getElementById('applySubmitBtn').innerHTML = '<i class="bi bi-send-fill me-2"></i>Submit Application';

  // Reset all optional fields to hidden
  const _g = id => document.getElementById(id);
  document.getElementById('aScreeningWrap').innerHTML = '';
  const _ns=document.getElementById('aNatSearch'); if(_ns)_ns.value='';
  const _nh=document.getElementById('aNat'); if(_nh)_nh.value='';
  ['aRowNatIqama','aRowExpCert','aIqamaNumWrap'].forEach(id => {
    const el = _g(id); if (el) el.style.display = 'none';
  });

  // Load screening and show relevant fields
  try {
    const r = await fetch('/api/employer/screening/' + jobId);
    const d = await r.json();
    if (d.success) {
      // Show/hide rows based on employer filters (same logic as homepage)
      const fl = d.filters || {};
      const sN = !!fl.nationalities, sI = !!fl.iqama_types,
            sE = !!fl.min_experience, sC = !!fl.required_certs;
      if (_g('aColNat'))       _g('aColNat').style.display       = sN ? '' : 'none';
      if (_g('aColIqama'))     _g('aColIqama').style.display      = sI ? '' : 'none';
      if (_g('aRowNatIqama'))  _g('aRowNatIqama').style.display   = (sN||sI) ? '' : 'none';
      if (_g('aColExp'))       _g('aColExp').style.display        = sE ? '' : 'none';
      if (_g('aColCert'))      _g('aColCert').style.display       = sC ? '' : 'none';
      if (_g('aRowExpCert'))   _g('aRowExpCert').style.display    = (sE||sC) ? '' : 'none';
      if (_g('aIqamaNumWrap')) _g('aIqamaNumWrap').style.display = fl.require_iqama_number ? '' : 'none';
      // CV upload
      const requireCv = d.require_cv || 0;
      const cvRow = _g('aCvRow'); const cvLabel = _g('aCvLabel');
      if (cvRow) { cvRow.style.display = ''; cvRow.dataset.required = requireCv ? '1' : '0'; }
      if (cvLabel) cvLabel.innerHTML = requireCv
        ? 'CV / Resume (PDF) <span style="color:#dc2626">*</span>'
        : 'CV / Resume (PDF) <span style="font-size:.71rem;color:var(--text-muted);font-weight:400">(optional)</span>';

      // Custom screening questions
      if (d.questions?.length) {
        const wrap = _g('aScreeningWrap');
        d.questions.forEach((q, i) => {
          wrap.innerHTML += `
            <div class="apply-field">
              <label class="apply-label">Q${i+1}: ${esc(q.text)}</label>
              ${q.type === 'yesno'
                ? `<select class="apply-input screening-ans" data-q="${i}"><option value="">Select...</option><option value="yes">Yes</option><option value="no">No</option></select>`
                : `<input class="apply-input screening-ans" data-q="${i}" placeholder="Your answer...">`
              }
            </div>`;
        });
      }
    }
  } catch(e) {}

  document.getElementById('applyOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeApply(e) {
  if (!e || e.target === document.getElementById('applyOverlay') || e.type !== 'click' || !e.target) {
    document.getElementById('applyOverlay').style.display = 'none';
    document.body.style.overflow = '';
  }
}

async function submitApply() {
  const name  = document.getElementById('aName').value.trim();
  const phone = document.getElementById('aPhone').value.trim();
  if (!name)  { showApplyMsg('Full name is required', 'error'); return; }
  if (!phone) { showApplyMsg('Phone number is required', 'error'); return; }

  const email = document.getElementById('aEmail').value.trim();
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showApplyMsg('Please enter a valid email address', 'error');
    return;
  }

  const answers = [...document.querySelectorAll('.screening-ans')].map(el => ({
    q: parseInt(el.dataset.q), answer: el.value.trim()
  }));

  // CV validation
  const cvFile = document.getElementById('aCvFile')?.files?.[0];
  const cvRequired = document.getElementById('aCvRow')?.dataset.required === '1';
  if (cvRequired && !cvFile) { showApplyMsg('Please upload your CV (PDF, max 5MB)', 'error'); return; }
  if (cvFile && cvFile.size > 5*1024*1024) { showApplyMsg('CV too large — max 5MB', 'error'); return; }

  const btn = document.getElementById('applySubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

  const fd = new FormData();
  fd.append('full_name',        name);
  fd.append('phone',            phone);
  fd.append('whatsapp',         document.getElementById('aWa').value.trim() || '');
  fd.append('email',            document.getElementById('aEmail').value.trim() || '');
  fd.append('nationality',      document.getElementById('aNat').value.trim() || '');
  fd.append('iqama_status',     document.getElementById('aIqama').value || '');
  fd.append('experience_years', document.getElementById('aExp').value || '');
  fd.append('has_certificate',  document.getElementById('aCert').value === '1' ? '1' : '0');
  fd.append('iqama_number',     document.getElementById('aIqamaNum').value.trim() || '');
  fd.append('cover_note',       document.getElementById('aCover').value.trim() || '');
  fd.append('screening_answers', JSON.stringify(answers));
  if (cvFile) fd.append('cv', cvFile);

  try {
    const r = await fetch('/api/employer/apply/' + currentJobId, {
      method: 'POST',
      body: fd
    });
    const d = await r.json();
    if (d.success) {
      showApplyMsg('✅ Application submitted! The employer will contact you.', 'success');
      btn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>Applied!';
    } else {
      showApplyMsg(d.message || 'Submission failed', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-send-fill me-2"></i>Submit Application';
    }
  } catch(e) {
    showApplyMsg('Network error. Please try again.', 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-send-fill me-2"></i>Submit Application';
  }
}

function showApplyMsg(msg, type) {
  const el = document.getElementById('applyMsg');
  el.style.display = '';
  el.style.background = type === 'success' ? '#dcfce7' : '#fee2e2';
  el.style.color      = type === 'success' ? '#166534' : '#991b1b';
  el.textContent = msg;
}
</script>
