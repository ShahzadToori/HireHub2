<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Jobs — JobOrbit Employer</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/JobOrbitFavicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/employer/employer.css">
</head>
<body><script>
(function(){
  function applyTheme(t,save){
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.style.colorScheme=t;
    var i=document.getElementById('themeIcon');
    if(i)i.className=t==='dark'?'bi bi-sun-fill':'bi bi-moon-fill';
    if(save!==false)localStorage.setItem('theme',t);
  }
  applyTheme(localStorage.getItem('theme')||'light',false);
  document.addEventListener('DOMContentLoaded',function(){
    var btn=document.getElementById('themeToggle');
    if(btn)btn.addEventListener('click',function(){
      applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
    });
  });
  window.toggleTheme=function(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');};
})();
</script>
<nav class="ep-navbar">
  <div class="ep-nav-inner">
    <a href="/employer/dashboard.html" class="ep-nav-brand">
      <img src="/uploads/logo-1772305890056.svg" alt="JobOrbit" style="height:32px;filter:brightness(10)">
      <span>Employer Portal</span>
    </a>
    <div class="ep-nav-links">
      <a href="/employer/dashboard.html" class="ep-nav-link "><i class="bi bi-grid-fill"></i><span>Dashboard</span></a>
      <a href="/employer/jobs.html"      class="ep-nav-link ep-nav-active"><i class="bi bi-briefcase-fill"></i><span>My Jobs</span></a>
      <a href="/employer/post-job.html"  class="ep-nav-link "><i class="bi bi-plus-circle-fill"></i><span>Post Job</span></a>
      <a href="/employer/applications.html" class="ep-nav-link "><i class="bi bi-inbox-fill"></i><span>Applications</span></a>
    </div>
    <div class="ep-nav-right">
      <button class="ep-icon-btn" id="themeToggle"><i class="bi bi-moon-fill" id="themeIcon"></i></button>
      <div class="ep-user-menu" id="epUserMenu">
        <button class="ep-user-btn" onclick="toggleUserMenu()">
          <div class="ep-avatar" id="epAvatar">E</div>
          <span id="epCompanyName">Loading...</span>
          <i class="bi bi-chevron-down" style="font-size:.7rem"></i>
        </button>
        <div class="ep-user-dropdown" id="epUserDropdown">
          <a href="/employer/profile.html"><i class="bi bi-person-gear me-2"></i>Profile</a>
          <a href="/" target="_blank"><i class="bi bi-box-arrow-up-right me-2"></i>View Site</a>
          <div class="ep-dropdown-divider"></div>
          <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left me-2"></i>Logout</a>
        </div>
      </div>
    </div>
  </div>
</nav>
<div class="ep-mobile-nav">
  <a href="/employer/dashboard.html" class="ep-mob-link "><i class="bi bi-grid-fill"></i><span>Home</span></a>
  <a href="/employer/jobs.html" class="ep-mob-link active"><i class="bi bi-briefcase-fill"></i><span>Jobs</span></a>
  <a href="/employer/post-job.html" class="ep-mob-link "><i class="bi bi-plus-circle-fill"></i><span>Post</span></a>
  <a href="/employer/applications.html" class="ep-mob-link "><i class="bi bi-inbox-fill"></i><span>Inbox</span></a>

<div class="ep-page">
  <div class="ep-page-header">
    <div>
      <h1 class="ep-page-title">My Jobs</h1>
      <p class="ep-page-sub">Manage your active and past job listings</p>
    </div>
    <a href="/employer/data-grid.html?type=jobs" class="ep-btn-outline" style="margin-right:.5rem"><i class="bi bi-table me-1"></i>Table View</a><a href="/employer/post-job.html" class="ep-btn-primary"><i class="bi bi-plus-lg me-2"></i>Post New Job</a>
  </div>

  <!-- Filter bar -->
  <div class="ep-filter-bar">
    <button class="ep-filter-btn active" onclick="filterJobs('all',this)">All</button>
    <button class="ep-filter-btn" onclick="filterJobs('active',this)">Active</button>
    <button class="ep-filter-btn" onclick="filterJobs('closed',this)">Closed</button>
    <div class="ms-auto">
      <input type="text" class="ep-input ep-search-input" id="jobSearch" placeholder="Search jobs..." oninput="searchJobs(this.value)">
    </div>
  </div>

  <div id="jobsList"><div class="ep-loading">Loading your jobs...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>

const API = {
  async get(url) {
    const r = await fetch(url, { credentials: 'include' });
    return r.json();
  },
  async post(url, data) {
    const r = await fetch(url, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    return r.json();
  },
  async put(url, data) {
    const r = await fetch(url, { method: 'PUT', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    return r.json();
  },
  async del(url) {
    const r = await fetch(url, { method: 'DELETE', credentials: 'include' });
    return r.json();
  }
};

async function checkAuth() {
  try {
    const d = await API.get('/api/employer/me');
    if (!d.success) { window.location.href = '/employer/'; return null; }
    const n = document.getElementById('epCompanyName');
    const a = document.getElementById('epAvatar');
    if (n) n.textContent = d.employer.company_name;
    if (a) a.textContent = d.employer.company_name.charAt(0).toUpperCase();
    return d;
  } catch(e) { window.location.href = '/employer/'; return null; }
}

async function logout() {
  await API.post('/api/employer/logout', {});
  window.location.href = '/employer/';
}

function toggleUserMenu() {
  document.getElementById('epUserDropdown')?.classList.toggle('show');
}
document.addEventListener('click', e => {
  const menu = document.getElementById('epUserMenu');
  if (menu && !menu.contains(e.target)) {
    document.getElementById('epUserDropdown')?.classList.remove('show');
  }
});

function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'ep-toast ep-toast-' + type;
  t.innerHTML = '<i class="bi bi-' + (type==='success'?'check-circle-fill':'exclamation-circle-fill') + ' me-2"></i>' + msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
}

function expiryLabel(date) {
  const diff = new Date(date) - new Date();
  if (diff < 0) return 'Expired';
  const hours = Math.floor(diff / 3600000);
  if (hours < 24) return 'Expires in ' + hours + 'h';
  const days = Math.floor(diff / 86400000);
  return 'Expires in ' + days + 'd';
}

function timeAgo(date) {
  const d = new Date(date), now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

let allJobs = [];
let currentFilter = 'all';

async function init() {
  await checkAuth();
  const d = await API.get('/api/employer/jobs');
  allJobs = d.jobs || [];
  renderJobs(allJobs);
}

function filterJobs(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.ep-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = status === 'all' ? allJobs : allJobs.filter(j => j.status === status);
  renderJobs(filtered);
}

function searchJobs(q) {
  const filtered = allJobs.filter(j =>
    j.title.toLowerCase().includes(q.toLowerCase()) ||
    j.location.toLowerCase().includes(q.toLowerCase())
  );
  renderJobs(filtered);
}

function renderJobs(jobs) {
  const wrap = document.getElementById('jobsList');
  if (!jobs.length) {
    wrap.innerHTML = '<div class="ep-empty"><i class="bi bi-briefcase"></i><p>No jobs found. <a href="/employer/post-job.html">Post your first job →</a></p></div>';
    return;
  }
  wrap.innerHTML = jobs.map(j => `
    <div class="ep-job-card" id="job-${j.id}">
      <div class="ep-job-card-header">
        <div>
          <div class="ep-job-card-title">${j.title}</div>
          <div class="ep-job-card-meta">
            <span><i class="bi bi-geo-alt me-1"></i>${j.location}</span>
            <span><i class="bi bi-briefcase me-1"></i>${j.job_type}</span>
            ${j.salary ? `<span><i class="bi bi-cash me-1"></i>${j.salary}</span>` : ''}
            <span><i class="bi bi-clock me-1"></i>${timeAgo(j.created_at)}</span>
            <span><i class="bi bi-eye me-1"></i>${j.views || 0} views</span>
            ${j.expires_at ? `<span style="color:${new Date(j.expires_at) < new Date() ? '#dc2626' : new Date(j.expires_at) - new Date() < 86400000 ? '#d97706' : '#059669'}">
              <i class="bi bi-hourglass-split me-1"></i>${expiryLabel(j.expires_at)}</span>` : ''}
          </div>
        </div>
        <span class="ep-badge ep-badge-${j.status==='active'?'green':j.status==='closed'?'gray':'yellow'}">${j.status}</span>
      </div>
      <div class="ep-job-card-footer">
        <div class="ep-job-apps" onclick="window.location.href='/employer/applications.html?job_id=${j.id}'">
          <i class="bi bi-people-fill me-1"></i>
          <strong>${j.application_count || 0}</strong> applications
          ${j.new_applications > 0 ? `<span class="ep-badge ep-badge-blue ms-2">${j.new_applications} new</span>` : ''}
        </div>
        <div class="ep-job-card-actions">
          <button class="ep-btn-outline ep-btn-sm" onclick="window.location.href='/employer/applications.html?job_id=${j.id}'">
            <i class="bi bi-inbox"></i> Applications
          </button>
          ${j.status === 'active' ?
            `<button class="ep-btn-outline ep-btn-sm" onclick="editJob(${j.id})"><i class="bi bi-pencil"></i> Edit</button>
             <button class="ep-btn-outline ep-btn-sm ep-btn-danger" onclick="closeJob(${j.id})"><i class="bi bi-x-circle"></i> Close</button>` :
            `<button class="ep-btn-outline ep-btn-sm" onclick="repostJob(${j.id})"><i class="bi bi-arrow-repeat"></i> Repost</button>`
          }
          <button class="ep-btn-outline ep-btn-sm" onclick="shareWhatsApp(${j.id})">
            <i class="bi bi-whatsapp" style="color:#25d366"></i> WhatsApp
          </button>
          <button class="ep-btn-outline ep-btn-sm" onclick="copyShareMsg(${j.id})">
            <i class="bi bi-clipboard"></i> Copy
          </button>
        </div>
      </div>
    </div>`).join('');
}

async function closeJob(id) {
  if (!confirm('Close this job? It will no longer appear in search results.')) return;
  const d = await API.del('/api/employer/jobs/' + id);
  if (d.success) { showToast('Job closed'); init(); }
  else showToast(d.message, 'error');
}

async function repostJob(id) {
  const d = await API.post('/api/employer/jobs/' + id + '/repost', {});
  if (d.success) { showToast('Job reposted for 30 days!'); init(); }
  else showToast(d.message, 'error');
}

function editJob(id) {
  window.location.href = '/employer/post-job.html?edit=' + id;
}

function buildShareMsg(id) {
  const j = allJobs.find(x => x.id === id);
  if (!j) return '';
  // Truncate description to ~200 chars
  const desc = (j.description || '').replace(/\n+/g,' ').trim();
  const shortDesc = desc.length > 200 ? desc.substring(0, 200) + '…' : desc;
  const url = 'https://joborbit.org/job/' + j.slug;

  return '🔵 *JOB VACANCY*\n'
    + '*' + j.company + '*\n\n'
    + '📋 *' + j.title + '*\n'
    + '📍 ' + j.location + '\n'
    + '💼 ' + (j.job_type || 'Full-time') + '\n'
    + (j.salary ? '💰 ' + j.salary + '\n' : '')
    + '\n' + shortDesc + '\n\n'
    + '🔗 View & apply: ' + url + '\n\n'
    + '_Posted via JobOrbit.org_';
}

function shareWhatsApp(id) {
  const msg = buildShareMsg(id);
  if (!msg) return;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function copyShareMsg(id) {
  const msg = buildShareMsg(id);
  if (!msg) return;
  navigator.clipboard.writeText(msg).then(() => showToast('Copied to clipboard!'));
}

init();

/* Inactivity timer */
(function() {
  var WARN = 25*60*1000, LOGOUT = 30*60*1000;
  var warnT, logoutT, shown = false;
  function reset() {
    clearTimeout(warnT); clearTimeout(logoutT);
    if (shown) hide();
    warnT = setTimeout(warn, WARN);
    logoutT = setTimeout(auto, LOGOUT);
  }
  function warn() {
    shown = true;
    var el = document.getElementById('inactWarn');
    if (!el) {
      el = document.createElement('div');
      el.id = 'inactWarn';
      el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem';
      el.innerHTML = '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:2rem;max-width:380px;width:100%;text-align:center"><div style=\"font-size:2rem;margin-bottom:.5rem\">⏰</div><h3 style=\"font-family:Syne,sans-serif;font-weight:800;color:var(--text-primary);margin-bottom:.5rem\">Still there?</h3><p style=\"color:var(--text-secondary);font-size:.9rem\">You\'ll be logged out in <strong id=\"inactCD\">5:00</strong></p><div style=\"display:flex;gap:.75rem;justify-content:center;margin-top:1.25rem\"><button class=\"ep-btn-primary\" onclick=\"keepIn()\">Keep me logged in</button><button class=\"ep-btn-outline\" onclick=\"logoutNow()\">Logout</button></div></div>';
      document.body.appendChild(el);
      var s = 300;
      var ci = setInterval(function(){ s--; var e=document.getElementById('inactCD'); if(e) e.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; if(s<=0) clearInterval(ci); }, 1000);
    }
    el.style.display = 'flex';
  }
  function hide() { shown=false; var el=document.getElementById('inactWarn'); if(el) el.style.display='none'; }
  function auto() { fetch('/api/employer/logout',{method:'POST',credentials:'include'}); window.location.href='/employer/?reason=timeout'; }
  window.keepIn = function(){ hide(); reset(); fetch('/api/employer/me',{credentials:'include'}); };
  window.logoutNow = async function(){ await fetch('/api/employer/logout',{method:'POST',credentials:'include'}); window.location.href='/employer/'; };
  ['mousedown','keypress','scroll','touchstart','click'].forEach(function(e){ document.addEventListener(e,reset,{passive:true}); });
  reset();
})();
</script>
<script src="/employer/feedback-widget.js"></script>
</body></html>
