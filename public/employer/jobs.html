<body><script>
(function(){
  function applyTheme(t,save){
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.style.colorScheme=t;
    var i=document.getElementById('themeIcon');
    if(i)i.className=t==='dark'?'bi bi-sun-fill':'bi bi-moon-fill';
    if(save!==false)localStorage.setItem('theme',t);
  }
  applyTheme(localStorage.getItem('theme')||'light',false);
  document.addEventListener('DOMContentLoaded',function(){
    var btn=document.getElementById('themeToggle');
    if(btn)btn.addEventListener('click',function(){
      applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
    });
  });
  window.toggleTheme=function(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');};
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>

const API = {
  async get(url) {
    const r = await fetch(url, { credentials: 'include' });
    return r.json();
  },
  async post(url, data) {
    const r = await fetch(url, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    return r.json();
  },
  async put(url, data) {
    const r = await fetch(url, { method: 'PUT', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    return r.json();
  },
  async del(url) {
    const r = await fetch(url, { method: 'DELETE', credentials: 'include' });
    return r.json();
  }
};

async function checkAuth() {
  try {
    const d = await API.get('/api/employer/me');
    if (!d.success) { window.location.href = '/employer/'; return null; }
    const n = document.getElementById('epCompanyName');
    const a = document.getElementById('epAvatar');
    if (n) n.textContent = d.employer.company_name;
    if (a) {
      if (d.employer.logo_url) {
        a.innerHTML = `<img src="${d.employer.logo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;">`;
        a.style.padding = '0';
        a.style.overflow = 'hidden';
        a.style.background = 'transparent';
      } else {
        a.textContent = d.employer.company_name.charAt(0).toUpperCase();
      }
    }
    return d;
  } catch(e) { window.location.href = '/employer/'; return null; }
}

async function logout() {
  if (!(await showConfirm('Are you sure you want to log out?', { title: 'Log out' }))) return;
  await API.post('/api/employer/logout', {});
  window.location.href = '/employer/';
}

function toggleUserMenu() {
  document.getElementById('epUserDropdown')?.classList.toggle('show');
}
document.addEventListener('click', e => {
  const menu = document.getElementById('epUserMenu');
  if (menu && !menu.contains(e.target)) {
    document.getElementById('epUserDropdown')?.classList.remove('show');
  }
  if (!e.target.closest('.ep-action-menu')) closeMenus();
});

function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'ep-toast ep-toast-' + type;
  t.innerHTML = '<i class="bi bi-' + (type==='success'?'check-circle-fill':'exclamation-circle-fill') + ' me-2"></i>' + msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
}

function expiryLabel(date) {
  const diff = new Date(date) - new Date();
  if (diff < 0) return 'Expired';
  const hours = Math.floor(diff / 3600000);
  if (hours < 24) return 'Expires in ' + hours + 'h';
  const days = Math.floor(diff / 86400000);
  return 'Expires in ' + days + 'd';
}

function timeAgo(date) {
  const d = new Date(date), now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

let allJobs = [];
const PAGE_SIZE = 10;
let currentPage = 1;
let currentFilteredJobs = [];
let currentFilter = 'all';

async function init() {
  await checkAuth();
  const d = await API.get('/api/employer/jobs');
  allJobs = d.jobs || [];
  renderJobs(allJobs);

  if (window.location.hash === '#requirements') {
    const btn = document.querySelector('[onclick*="filterJobs(\'requirements\'"]');
    if (btn) filterJobs('requirements', btn);
  }
}

function filterJobs(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.ep-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (status === 'requirements') {
    renderRequirements(allJobs);
    return;
  }
  // 'expired' (auto-set once expires_at passes) is grouped under the
  // "Closed" tab too, so an auto-expired job doesn't just vanish from
  // both filter views from the employer's perspective.
  const filtered = status === 'all' ? allJobs
    : status === 'closed' ? allJobs.filter(j => j.status === 'closed' || j.status === 'expired')
    : allJobs.filter(j => j.status === status);
  renderJobs(filtered);
}

function searchJobs(q) {
  const filtered = allJobs.filter(j =>
    j.title.toLowerCase().includes(q.toLowerCase()) ||
    j.location.toLowerCase().includes(q.toLowerCase())
  );
  renderJobs(filtered);
}

function renderJobs(jobs) {
  currentFilteredJobs = jobs;
  currentPage = 1;
  renderPage();
}

function renderPage() {
  const wrap = document.getElementById('jobsList');
  const pag  = document.getElementById('ep-pagination');
  const info = document.getElementById('ep-page-info');
  if (!currentFilteredJobs.length) {
    wrap.innerHTML = '<div class="ep-empty"><i class="bi bi-briefcase"></i><p>No jobs found. <a href="/employer/post-job.html">Post your first job →</a></p></div>';
    if(pag) pag.innerHTML=''; if(info) info.textContent='';
    return;
  }
  const total = Math.ceil(currentFilteredJobs.length / PAGE_SIZE);
  const start = (currentPage-1)*PAGE_SIZE;
  const slice = currentFilteredJobs.slice(start, start+PAGE_SIZE);
  wrap.innerHTML = slice.map(j => `
    <div class="ep-job-card" id="job-${j.id}">
      <div class="ep-job-card-header">
        <div style="flex:1;min-width:0">
          <div class="ep-job-card-title">${j.title}</div>
          <div class="ep-job-card-meta">
            <span><i class="bi bi-geo-alt"></i>${j.location}</span>
            <span><i class="bi bi-briefcase"></i>${j.job_type}</span>
            ${j.salary?`<span><i class="bi bi-cash"></i>${j.salary}</span>`:''}
            <span><i class="bi bi-clock"></i>${timeAgo(j.created_at)}</span>
          </div>
        </div>
        <span class="ep-badge ep-badge-${j.status==='active'?'green':j.status==='closed'?'gray':'yellow'}">${j.status}</span>
      </div>
      <!-- Stats -->
      <div style="display:flex;align-items:center;gap:.85rem;padding:.5rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:.6rem 0;flex-wrap:wrap">
        <span style="font-size:.76rem;color:var(--text-muted)"><i class="bi bi-eye me-1"></i>${j.views||0} views</span>
        <span class="ep-sparkline" id="spark-${j.id}"></span>
        <span style="font-size:.76rem;cursor:pointer" onclick="window.location.href='/employer/applications.html?job_id=${j.id}'">
          <i class="bi bi-people-fill me-1" style="color:var(--primary)"></i>
          <strong>${j.application_count||0}</strong> applications
          ${j.new_applications>0?`<span class="ep-badge ep-badge-blue ms-1">${j.new_applications} new</span>`:''}
        </span>
        ${j.expires_at?`<span style="font-size:.74rem;color:${new Date(j.expires_at)<new Date()?'#dc2626':new Date(j.expires_at)-new Date()<86400000*7?'#d97706':'var(--text-muted)'}"><i class="bi bi-hourglass-split me-1"></i>${expiryLabel(j.expires_at)}</span>`:''}
      </div>
      <!-- Actions -->
      <div style="display:flex;gap:.4rem;align-items:center">
        <button class="ep-btn-outline ep-btn-sm" style="flex:1" onclick="window.location.href='/employer/applications.html?job_id=${j.id}'">
          <i class="bi bi-inbox-fill me-1"></i>Applications
        </button>
        <button class="ep-btn-outline ep-btn-sm" style="flex:1;color:#25d366;border-color:#25d366" onclick="shareWhatsApp(${j.id})">
          <i class="bi bi-whatsapp me-1"></i>Share
        </button>
        <div class="ep-action-menu" id="menu-wrap-${j.id}">
          <button class="ep-btn-outline ep-btn-sm" onclick="toggleJobMenu(${j.id})" style="width:36px;padding:0" title="More actions">
            <i class="bi bi-three-dots-vertical"></i>
          </button>
          <div class="ep-action-menu-panel" id="menu-${j.id}">
            ${j.status==='active'?`
            <div class="ep-action-menu-item" onclick="editJob(${j.id});closeMenus()"><i class="bi bi-pencil" style="color:var(--primary)"></i>Edit Job</div>
            <div class="ep-action-menu-item" onclick="duplicateJob(${j.id});closeMenus()"><i class="bi bi-files"></i>Duplicate as New</div>
            <div class="ep-action-menu-item" onclick="copyShareMsg(${j.id});closeMenus()"><i class="bi bi-clipboard"></i>Copy Message</div>
            <div class="ep-action-menu-item danger" onclick="closeJob(${j.id});closeMenus()"><i class="bi bi-x-circle"></i>Close Job</div>
            <div class="ep-action-menu-item danger" onclick="deleteJob(${j.id});closeMenus()"><i class="bi bi-trash3"></i>Delete Job</div>`:`
            <div class="ep-action-menu-item" onclick="repostJob(${j.id});closeMenus()"><i class="bi bi-arrow-repeat" style="color:var(--primary)"></i>Repost</div>
            <div class="ep-action-menu-item" onclick="duplicateJob(${j.id});closeMenus()"><i class="bi bi-files"></i>Duplicate as New</div>
            <div class="ep-action-menu-item" onclick="copyShareMsg(${j.id});closeMenus()"><i class="bi bi-clipboard"></i>Copy Message</div>
            <div class="ep-action-menu-item danger" onclick="deleteJob(${j.id});closeMenus()"><i class="bi bi-trash3"></i>Delete Job</div>`}
          </div>
        </div>
      </div>
    </div>`).join('');
  loadSparklines(slice);
  // Pagination
  if(pag){
    if(total<=1){pag.innerHTML='';if(info)info.textContent='';return;}
    let h=`<button class="ep-page-btn" onclick="gotoPage(${currentPage-1})" ${currentPage===1?'disabled':''}><i class="bi bi-chevron-left"></i></button>`;
    for(let i=1;i<=total;i++){
      if(i===1||i===total||(i>=currentPage-1&&i<=currentPage+1))
        h+=`<button class="ep-page-btn ${i===currentPage?'active':''}" onclick="gotoPage(${i})">${i}</button>`;
      else if(i===currentPage-2||i===currentPage+2)
        h+=`<span style="padding:0 .2rem;color:var(--text-muted);line-height:34px">…</span>`;
    }
    h+=`<button class="ep-page-btn" onclick="gotoPage(${currentPage+1})" ${currentPage===total?'disabled':''}><i class="bi bi-chevron-right"></i></button>`;
    pag.innerHTML=h;
    if(info) info.textContent=`Page ${currentPage} of ${total} · ${currentFilteredJobs.length} jobs`;
  }
}

function gotoPage(page){
  const total=Math.ceil(currentFilteredJobs.length/PAGE_SIZE);
  if(page<1||page>total)return;
  currentPage=page;
  renderPage();
  document.getElementById('jobsList').scrollIntoView({behavior:'smooth',block:'start'});
}

function toggleJobMenu(id){
  const panel=document.getElementById('menu-'+id);
  const wasOpen=panel?.classList.contains('show');
  closeMenus();
  if(!wasOpen)panel?.classList.add('show');
}

function closeMenus(){
  document.querySelectorAll('.ep-action-menu-panel.show').forEach(p=>p.classList.remove('show'));
}

function renderRequirements(jobs) {
  const wrap = document.getElementById('jobsList');
  // Group by batch_id
  const batches = {};
  jobs.forEach(j => {
    if (!j.batch_id) return;
    if (!batches[j.batch_id]) batches[j.batch_id] = [];
    batches[j.batch_id].push(j);
  });
  const batchList = Object.values(batches);
  if (!batchList.length) {
    wrap.innerHTML = '<div class="ep-empty"><i class="bi bi-collection"></i><p>No bulk requirements posted yet.<br><a href="/employer/post-job.html">Post a bulk requirement →</a></p></div>';
    return;
  }
  wrap.innerHTML = batchList.map(batch => {
    const j0 = batch[0];
    const totalPositions = batch.reduce((s, j) => s + (parseInt(j.positions) || 1), 0);
    const totalApps = batch.reduce((s, j) => s + (parseInt(j.application_count) || 0), 0);
    const newApps = batch.reduce((s, j) => s + (parseInt(j.new_applications) || 0), 0);
    const hasActive = batch.some(j => j.status === 'active');
    const link = window.location.origin + '/requirement/' + j0.batch_id;
  const posList = batch.map(j => '• ' + j.title).join('\n');
  const descLine = j0.description ? '\n' + j0.description.substring(0,200).trim() + (j0.description.length>200?'...':'') + '\n' : '\n';
  const waText = encodeURIComponent(
    '🔵 *URGENT REQUIREMENT*\n' +
    '*' + j0.company + '*\n\n' +
    '📍 ' + j0.location + ' | 👥 ' + totalPositions + ' Positions\n\n' +
    '📋 *Open Positions:*\n' + posList + '\n' +
    descLine +
    '👉 ' + link + '\n\n' +
    '_Posted via JobOrbit.org_'
  );
    return `
    <div style="background:var(--bg-card);border:1.5px solid var(--border);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.06)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;margin-bottom:.6rem">
        <div style="flex:1;min-width:0">
          <p style="font-family:'Lexend',sans-serif;font-weight:700;font-size:1rem;color:var(--text-primary);margin:0 0 .35rem">${j0.company} — ${j0.location}</p>
          <div style="display:flex;flex-wrap:wrap;gap:.3rem .65rem">
            <span style="font-size:.75rem;color:var(--text-muted);display:flex;align-items:center;gap:.25rem"><i class="bi bi-calendar3"></i>${new Date(j0.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span>
            <span style="font-size:.75rem;color:var(--text-muted);display:flex;align-items:center;gap:.25rem"><i class="bi bi-people-fill" style="color:var(--primary)"></i>${totalPositions} positions</span>
            <span style="font-size:.75rem;color:var(--text-muted);display:flex;align-items:center;gap:.25rem"><i class="bi bi-inbox-fill"></i>${totalApps} applications${newApps > 0 ? ` <b style="color:var(--primary)">(${newApps} new)</b>` : ''}</span>
          </div>
        </div>
        <span class="ep-badge ep-badge-${hasActive ? 'green' : 'gray'}">${hasActive ? 'active' : 'closed'}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem .75rem;background:var(--surface);border-radius:10px;margin:.6rem 0">
        ${batch.map(j => `<span style="font-size:.72rem;font-weight:600;padding:.22rem .65rem;border-radius:20px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);white-space:nowrap">${j.title}</span>`).join('')}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border)">
        <a href="/employer/post-job.html?editBatch=${j0.batch_id}" class="ep-btn-outline ep-btn-sm" style="text-decoration:none;flex:1;min-width:calc(50% - .2rem);justify-content:center">
          <i class="bi bi-pencil-square"></i> Edit
        </a>
        <a href="/requirement/${j0.batch_id}?from=employer" class="ep-btn-outline ep-btn-sm" style="text-decoration:none;flex:1;min-width:calc(50% - .2rem);justify-content:center">
          <i class="bi bi-box-arrow-up-right"></i> View Page
        </a>
        <button class="ep-btn-outline ep-btn-sm" onclick="copyBatchLink('${j0.batch_id}', this)" style="flex:1;min-width:calc(50% - .2rem);justify-content:center">
          <i class="bi bi-link-45deg"></i> Copy Link
        </button>
        <a href="https://wa.me/?text=${waText}" target="_blank" class="ep-btn-outline ep-btn-sm" style="text-decoration:none;flex:1;min-width:calc(50% - .2rem);justify-content:center">
          <i class="bi bi-whatsapp" style="color:#25d366"></i> WhatsApp
        </a>
        <a href="https://t.me/share/url?url=${encodeURIComponent(link)}" target="_blank" class="ep-btn-outline ep-btn-sm" style="text-decoration:none;flex:1;min-width:calc(50% - .2rem);justify-content:center">
          <i class="bi bi-telegram" style="color:#2aabee"></i> Telegram
        </a>
        <button class="ep-btn-outline ep-btn-sm ep-btn-danger" onclick="closeBatch('${j0.batch_id}', this)" style="flex:1;min-width:calc(50% - .2rem);justify-content:center">
          <i class="bi bi-x-circle"></i> Close All
        </button>
        <button class="ep-btn-outline ep-btn-sm ep-btn-danger" onclick="deleteBatch('${j0.batch_id}', this)" style="flex:1;min-width:calc(50% - .2rem);justify-content:center">
          <i class="bi bi-trash3"></i> Delete All
        </button>
      </div>
    </div>`;
  }).join('');
}

function copyBatchLink(batchId, btn) {
  const link = window.location.origin + '/requirement/' + batchId;
  navigator.clipboard.writeText(link).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check-lg"></i> Copied!';
    setTimeout(() => btn.innerHTML = orig, 2000);
  });
}

async function closeBatch(batchId, btn) {

/* ── Per-job view-trend sparklines ── */
function localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderSparklineSvg(values) {
  const total = values.reduce((a,b) => a+b, 0);
  if (!total) return '';
  const max = Math.max(...values, 1);
  const w = 56, h = 20;
  const step = w / (values.length - 1);
  const points = values.map((v,i) => `${(i*step).toFixed(1)},${(h - (v/max)*h*0.85 - 1).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${points}" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="ep-sparkline-label">${total} views/14d</span>`;
}

async function loadSparklines(jobs) {
  await Promise.all(jobs.map(async j => {
    const el = document.getElementById('spark-' + j.id);
    if (!el) return;
    try {
      const d = await API.get('/api/employer/jobs/' + j.id + '/view-trend');
      const map = {};
      (d.trend || []).forEach(t => { map[t.day] = t.views; });
      const days = [];
      for (let i = 13; i >= 0; i--) {
        days.push(map[localDateStr(new Date(Date.now() - i*86400000))] || 0);
      }
      el.innerHTML = renderSparklineSvg(days);
    } catch (e) { /* leave blank — not critical */ }
  }));
}

function buildShareMsg(id) {
  const j = allJobs.find(x => x.id === id);
  if (!j) return '';
  // Truncate description to ~200 chars
  const desc = (j.description || '').replace(/\n+/g,' ').trim();
  const shortDesc = desc.length > 200 ? desc.substring(0, 200) + '…' : desc;
  const url = 'https://joborbit.org/job/' + j.slug;

  return '🔵 *JOB VACANCY*\n'
    + '*' + j.company + '*\n\n'
    + '📋 *' + j.title + '*\n'
    + '📍 ' + j.location + '\n'
    + '💼 ' + (j.job_type || 'Full-time') + '\n'
    + (j.salary ? '💰 ' + j.salary + '\n' : '')
    + '\n' + shortDesc + '\n\n'
    + '🔗 View & apply: ' + url + '\n\n'
    + '_Posted via JobOrbit.org_';
}

function shareWhatsApp(id) {
  const msg = buildShareMsg(id);
  if (!msg) return;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function copyShareMsg(id) {
  const msg = buildShareMsg(id);
  if (!msg) return;
  navigator.clipboard.writeText(msg).then(() => showToast('Copied to clipboard!'));
}

/* Inactivity timer */
(function() {
  var WARN = 25*60*1000, LOGOUT = 30*60*1000;
  var warnT, logoutT, shown = false;
  function reset() {
    clearTimeout(warnT); clearTimeout(logoutT);
    if (shown) hide();
    warnT = setTimeout(warn, WARN);
    logoutT = setTimeout(auto, LOGOUT);
  }
  function warn() {
    shown = true;
    var el = document.getElementById('inactWarn');
    if (!el) {
      el = document.createElement('div');
      el.id = 'inactWarn';
      el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem';
      el.innerHTML = '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:2rem;max-width:380px;width:100%;text-align:center"><div style=\"font-size:2rem;margin-bottom:.5rem\">⏰</div><h3 style=\"font-family:Lexend,sans-serif;font-weight:800;color:var(--text-primary);margin-bottom:.5rem\">Still there?</h3><p style=\"color:var(--text-secondary);font-size:.9rem\">You\'ll be logged out in <strong id=\"inactCD\">5:00</strong></p><div style=\"display:flex;gap:.75rem;justify-content:center;margin-top:1.25rem\"><button class=\"ep-btn-primary\" onclick=\"keepIn()\">Keep me logged in</button><button class=\"ep-btn-outline\" onclick=\"logoutNow()\">Logout</button></div></div>';
      document.body.appendChild(el);
      var s = 300;
      var ci = setInterval(function(){ s--; var e=document.getElementById('inactCD'); if(e) e.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; if(s<=0) clearInterval(ci); }, 1000);
    }
    el.style.display = 'flex';
  }
  function hide() { shown=false; var el=document.getElementById('inactWarn'); if(el) el.style.display='none'; }
  function auto() { fetch('/api/employer/logout',{method:'POST',credentials:'include'}); window.location.href='/employer/?reason=timeout'; }
  window.keepIn = function(){ hide(); reset(); fetch('/api/employer/me',{credentials:'include'}); };
  window.logoutNow = async function(){ await fetch('/api/employer/logout',{method:'POST',credentials:'include'}); window.location.href='/employer/'; };
  ['mousedown','keypress','scroll','touchstart','click'].forEach(function(e){ document.addEventListener(e,reset,{passive:true}); });
  reset();
})();
