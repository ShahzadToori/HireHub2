  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/JobOrbitFavicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

<body><script>
(function(){
  function applyTheme(t,save){
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.style.colorScheme=t;
    var i=document.getElementById('themeIcon');
    if(i)i.className=t==='dark'?'bi bi-sun-fill':'bi bi-moon-fill';
    if(save!==false)localStorage.setItem('theme',t);
  }
  applyTheme(localStorage.getItem('theme')||'light',false);
  document.addEventListener('DOMContentLoaded',function(){
    var btn=document.getElementById('themeToggle');
    if(btn)btn.addEventListener('click',function(){
      applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
    });
  });
  window.toggleTheme=function(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');};
})();
</script>
<nav class="ep-navbar">
  <div class="ep-nav-inner">
    <a href="/employer/dashboard.html" class="ep-nav-brand">
      <img src="/uploads/logo-1772305890056.svg" alt="JobOrbit" style="height:32px;filter:brightness(10)">
      <span>Employer Portal</span>
    </a>
    <div class="ep-nav-links">
      <a href="/employer/dashboard.html" class="ep-nav-link "><i class="bi bi-grid-fill"></i><span>Dashboard</span></a>
      <a href="/employer/jobs.html"      class="ep-nav-link "><i class="bi bi-briefcase-fill"></i><span>My Jobs</span></a>
      <a href="/employer/post-job.html"  class="ep-nav-link "><i class="bi bi-plus-circle-fill"></i><span>Post Job</span></a>
      <a href="/employer/applications.html" class="ep-nav-link "><i class="bi bi-inbox-fill"></i><span>Applications</span></a>

    <div class="ep-nav-right">

        <button class="ep-user-btn" onclick="toggleUserMenu()">
          <div class="ep-avatar" id="epAvatar">E</div>
          <span id="epCompanyName">Loading...</span>
          <i class="bi bi-chevron-down" style="font-size:.7rem"></i>
        </button>
        <div class="ep-user-dropdown" id="epUserDropdown">
          <a href="/employer/profile.html"><i class="bi bi-person-gear me-2"></i>Profile</a>

        </div>

  </div>
</nav>
<div class="ep-mobile-nav">
  <a href="/employer/dashboard.html" class="ep-mob-link "><i class="bi bi-grid-fill"></i><span>Home</span></a>
  <a href="/employer/jobs.html" class="ep-mob-link "><i class="bi bi-briefcase-fill"></i><span>Jobs</span></a>
  <a href="/employer/post-job.html" class="ep-mob-link "><i class="bi bi-plus-circle-fill"></i><span>Post</span></a>
  <a href="/employer/applications.html" class="ep-mob-link "><i class="bi bi-inbox-fill"></i><span>Inbox</span></a>
</div>
<div class="ep-page">
  <div class="ep-page-header">
    <div>
      <h1 class="ep-page-title">Company Profile</h1>
      <p class="ep-page-sub">Update your company information</p>
    </div>
  </div>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="ep-card">
        <h2 class="ep-card-title mb-3">Company Details</h2>
        <div class="row g-3">
          <div class="col-12">
            <div class="ep-field">
              <label class="ep-label">Company Name</label>
              <input type="text" class="ep-input" id="pCompany">
            </div>
          </div>
          <div class="col-sm-6">
            <div class="ep-field">
              <label class="ep-label">Contact Person</label>
              <input type="text" class="ep-input" id="pContact">
            </div>
          </div>
          <div class="col-sm-6">
            <div class="ep-field">
              <label class="ep-label">Sector</label>
              <select class="ep-input" id="pSector">
                <option value="">Select...</option>
                <option>Construction</option>
                <option>Oil & Gas</option>
                <option>Healthcare</option>
                <option>Technology</option>
                <option>Manufacturing</option>
                <option>Hospitality</option>
                <option>Finance</option>
                <option>Education</option>
                <option>Other</option>
              </select>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="ep-field">
              <label class="ep-label">City</label>
              <input type="text" class="ep-input" id="pCity">
            </div>
          </div>
          <div class="col-sm-6">
            <div class="ep-field">
              <label class="ep-label">Phone</label>
              <input type="tel" class="ep-input" id="pPhone">
            </div>
          </div>
          <div class="col-sm-6">
            <div class="ep-field">
              <label class="ep-label">WhatsApp</label>
              <input type="tel" class="ep-input" id="pWhatsApp">
            </div>
          </div>
          <div class="col-sm-6">
            <div class="ep-field">
              <label class="ep-label">Website</label>
              <input type="url" class="ep-input" id="pWebsite" placeholder="https://...">
            </div>
          </div>
          <div class="col-12">
            <div class="ep-field">
              <label class="ep-label">About Company</label>
              <textarea class="ep-input" id="pAbout" rows="4" placeholder="Tell candidates about your company..."></textarea>
            </div>
          </div>
        </div>
        <div id="profileMsg" class="ep-msg d-none mt-3"></div>
        <button class="ep-btn-primary mt-3" onclick="saveProfile()">
          <i class="bi bi-check-lg me-2"></i>Save Changes
        </button>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="ep-card">
        <h2 class="ep-card-title mb-3">Account Info</h2>
        <div class="ep-field">
          <label class="ep-label">Email Address</label>
          <input type="email" class="ep-input" id="pEmail" disabled style="opacity:.6">
        </div>
        <div class="ep-field mt-3">
          <label class="ep-label">Member Since</label>
          <input class="ep-input" id="pJoined" disabled style="opacity:.6">
        </div>
      </div>
      <div class="ep-card mt-4">
        <h2 class="ep-card-title mb-1">Danger Zone</h2>
        <p style="font-size:.82rem;color:var(--text-muted);margin-bottom:1rem">These actions cannot be undone</p>
        <button class="ep-btn-outline ep-btn-danger w-100" onclick="logout()">
          <i class="bi bi-box-arrow-left me-2"></i>Logout from All Devices
        </button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>

const API = {
  async get(url) {
    const r = await fetch(url, { credentials: 'include' });
    return r.json();
  },
  async post(url, data) {
    const r = await fetch(url, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    return r.json();
  },
  async put(url, data) {
    const r = await fetch(url, { method: 'PUT', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    return r.json();
  },
  async del(url) {
    const r = await fetch(url, { method: 'DELETE', credentials: 'include' });
    return r.json();
  }
};

async function checkAuth() {
  try {
    const d = await API.get('/api/employer/me');
    if (!d.success) { window.location.href = '/employer/'; return null; }
    const n = document.getElementById('epCompanyName');
    const a = document.getElementById('epAvatar');
    if (n) n.textContent = d.employer.company_name;
    if (a) a.textContent = d.employer.company_name.charAt(0).toUpperCase();
    return d;
  } catch(e) { window.location.href = '/employer/'; return null; }
}

async function logout() {
  await API.post('/api/employer/logout', {});
  window.location.href = '/employer/';
}

function toggleUserMenu() {
  document.getElementById('epUserDropdown')?.classList.toggle('show');
}
document.addEventListener('click', e => {
  const menu = document.getElementById('epUserMenu');
  if (menu && !menu.contains(e.target)) {
    document.getElementById('epUserDropdown')?.classList.remove('show');
  }
});

function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'ep-toast ep-toast-' + type;
  t.innerHTML = '<i class="bi bi-' + (type==='success'?'check-circle-fill':'exclamation-circle-fill') + ' me-2"></i>' + msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
}

function timeAgo(date) {
  const d = new Date(date), now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

async function init() {
  const d = await checkAuth();
  if (!d) return;
  const e = d.employer;
  document.getElementById('pCompany').value  = e.company_name || '';
  document.getElementById('pContact').value  = e.contact_name || '';
  document.getElementById('pCity').value     = e.city || '';
  document.getElementById('pPhone').value    = e.phone || '';
  document.getElementById('pWhatsApp').value = e.whatsapp || '';
  document.getElementById('pWebsite').value  = e.website || '';
  document.getElementById('pAbout').value    = e.about || '';
  document.getElementById('pEmail').value    = e.email || '';
  document.getElementById('pJoined').value   = new Date(e.created_at).toLocaleDateString();
  if (e.sector) document.getElementById('pSector').value = e.sector;
}

async function saveProfile() {
  const msg = document.getElementById('profileMsg');
  const btn = event.target;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
  const d = await API.put('/api/employer/profile', {
    company_name:  document.getElementById('pCompany').value,
    contact_name:  document.getElementById('pContact').value,
    sector:        document.getElementById('pSector').value,
    city:          document.getElementById('pCity').value,
    phone:         document.getElementById('pPhone').value,
    whatsapp:      document.getElementById('pWhatsApp').value,
    website:       document.getElementById('pWebsite').value,
    about:         document.getElementById('pAbout').value,
  });
  btn.disabled = false;
  btn.innerHTML = '<i class="bi bi-check-lg me-2"></i>Save Changes';
  if (d.success) showToast('Profile updated!');
  else { msg.className='ep-msg ep-msg-error'; msg.textContent=d.message; msg.classList.remove('d-none'); }
}

init();

/* Inactivity timer */
(function() {
  var WARN = 25*60*1000, LOGOUT = 30*60*1000;
  var warnT, logoutT, shown = false;
  function reset() {
    clearTimeout(warnT); clearTimeout(logoutT);
    if (shown) hide();
    warnT = setTimeout(warn, WARN);
    logoutT = setTimeout(auto, LOGOUT);
  }
  function warn() {
    shown = true;
    var el = document.getElementById('inactWarn');
    if (!el) {
      el = document.createElement('div');
      el.id = 'inactWarn';
      el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem';
      el.innerHTML = '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:2rem;max-width:380px;width:100%;text-align:center"><div style=\"font-size:2rem;margin-bottom:.5rem\">⏰</div><h3 style=\"font-family:Syne,sans-serif;font-weight:800;color:var(--text-primary);margin-bottom:.5rem\">Still there?</h3><p style=\"color:var(--text-secondary);font-size:.9rem\">You\'ll be logged out in <strong id=\"inactCD\">5:00</strong></p><div style=\"display:flex;gap:.75rem;justify-content:center;margin-top:1.25rem\"><button class=\"ep-btn-primary\" onclick=\"keepIn()\">Keep me logged in</button><button class=\"ep-btn-outline\" onclick=\"logoutNow()\">Logout</button></div></div>';
      document.body.appendChild(el);
      var s = 300;
      var ci = setInterval(function(){ s--; var e=document.getElementById('inactCD'); if(e) e.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; if(s<=0) clearInterval(ci); }, 1000);
    }
    el.style.display = 'flex';
  }
  function hide() { shown=false; var el=document.getElementById('inactWarn'); if(el) el.style.display='none'; }
  function auto() { fetch('/api/employer/logout',{method:'POST',credentials:'include'}); window.location.href='/employer/?reason=timeout'; }
  window.keepIn = function(){ hide(); reset(); fetch('/api/employer/me',{credentials:'include'}); };
  window.logoutNow = async function(){ await fetch('/api/employer/logout',{method:'POST',credentials:'include'}); window.location.href='/employer/'; };
  ['mousedown','keypress','scroll','touchstart','click'].forEach(function(e){ document.addEventListener(e,reset,{passive:true}); });
  reset();
})();
</script>
<script src="/employer/feedback-widget.js"></script>
